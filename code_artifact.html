            const v1x = c.x - a.x, v1z = c.z - a.z;
            const v2x = px - a.x, v2z = pz - a.z;
            const den = v0x * v1z - v1x * v0z;
            if (Math.abs(den) < 1e-8) return null;
            const v = (v2x * v1z - v1x * v2z) / den;
            const w = (v0x * v2z - v2x * v0z) / den;
            const u = 1.0 - v - w;
            if (u >= -1e-4 && v >= -1e-4 && w >= -1e-4) return { u, v, w };
            return null;
        }

        function sampleContinuousSurface(lx, lz, minRimRequirement) {
            const fz = lz / cellZ + nzCells * 0.5;
            const cz = clamp(Math.floor(fz), 0, nz - 2);
            const rowOff = (cz & 1) === 1 ? 0.5 : 0.0;
            const fx = lx / cellSize + resolution * 0.5 + 0.25 - rowOff;
            const cx = clamp(Math.floor(fx), 0, nx - 2);

            for (let dz = -1; dz <= 1; dz++) {
                const iz = cz + dz;
                if (iz < 0 || iz >= nz - 1) continue;
                for (let dx = -1; dx <= 1; dx++) {
                    const ix = cx + dx;
                    if (ix < 0 || ix >= nx - 1) continue;
                    const a = iz * nx + ix, b = a + 1, c = a + nx, d = c + 1;
                    if (!(inside[a] || inside[b] || inside[c] || inside[d])) continue;

                    for (let t = 0; t < 2; t++) {
                        const [i0, i1, i2] = CellTriContour(a, b, c, d, iz, t);
                        if (!(inside[i0] && inside[i1] && inside[i2])) continue;
                        if (caveExcludedCenters.has(i0) || caveExcludedCenters.has(i1) || caveExcludedCenters.has(i2)) continue;
                        const bary = barycentric2D(lx, lz, xz[i0], xz[i1], xz[i2]);
                        if (!bary) continue;

                        const { u, v, w } = bary;
                        const rDist = u * Math.min(rimDist[i0], 50) + v * Math.min(rimDist[i1], 50) + w * Math.min(rimDist[i2], 50);
                        if (rDist < minRimRequirement) return null;

                        const wet = Boolean(river[i0] || river[i1] || river[i2] || lakeId[i0] > 0 || lakeId[i1] > 0 || lakeId[i2] > 0 || bankSlopeFlag[i0] || bankSlopeFlag[i1] || bankSlopeFlag[i2]);
                        const trailW = u * trailWeight[i0] + v * trailWeight[i1] + w * trailWeight[i2];
                        const y = u * H[i0] + v * H[i1] + w * H[i2];
                        const steepD = u * Math.min(steepDist[i0], 50) + v * Math.min(steepDist[i1], 50) + w * Math.min(steepDist[i2], 50);

                        const ux = xz[i1].x - xz[i0].x, uy = H[i1] - H[i0], uz = xz[i1].z - xz[i0].z;
                        const vx = xz[i2].x - xz[i0].x, vy = H[i2] - H[i0], vz = xz[i2].z - xz[i0].z;
                        let nx0 = uy * vz - uz * vy;
                        let ny0 = uz * vx - ux * vz;
                        let nz0 = ux * vy - uy * vx;
                        const nLen = Math.hypot(nx0, ny0, nz0) || 1;
                        nx0 /= nLen; ny0 /= nLen; nz0 /= nLen;
                        if (ny0 < 0) { nx0 = -nx0; ny0 = -ny0; nz0 = -nz0; }

                        return { y, ny: ny0, normal: { x: nx0, y: ny0, z: nz0 }, wet, steepD, trailW };
                    }
                }
            }
            return null;
        }

        // 2D Poisson Disk Sampling (`FloatingTerrainBuilder.Poisson` 移植)
        function poissonSample2D(radius) {
            const cell = radius / 1.41421356;
            const gw = Math.max(4, Math.ceil((2.0 * half) / cell));
            const grid = new Int32Array(gw * gw).fill(-1);
            const pts = [];
            const active = [];

            const first = { x: vr.signed() * half * 0.6, z: vr.signed() * half * 0.6 };
            pts.push(first);
            active.push(0);
            const fgx = clamp(Math.floor((first.x + half) / cell), 0, gw - 1);
            const fgz = clamp(Math.floor((first.z + half) / cell), 0, gw - 1);
            grid[fgz * gw + fgx] = 0;

            const rSq = radius * radius;
            while (active.length > 0) {
                const ai = Math.floor(vr.next() * active.length);
                const p = pts[active[ai]];
                let found = false;
                for (let t = 0; t < 18; t++) {
                    const ang = vr.next() * Math.PI * 2.0;
                    const rad = radius * (1.0 + vr.next());
                    const qx = p.x + Math.cos(ang) * rad;
                    const qz = p.z + Math.sin(ang) * rad;
                    if (qx * qx + qz * qz >= half * half * 0.96) continue;
                    const gx = Math.floor((qx + half) / cell);
                    const gz = Math.floor((qz + half) / cell);
                    if (gx < 0 || gz < 0 || gx >= gw || gz >= gw) continue;

                    let ok = true;
                    for (let dz = -2; dz <= 2 && ok; dz++) {
                        const zz = gz + dz;
                        if (zz < 0 || zz >= gw) continue;
                        for (let dx = -2; dx <= 2; dx++) {
                            const xx = gx + dx;
                            if (xx < 0 || xx >= gw) continue;
                            const id = grid[zz * gw + xx];
                            if (id >= 0) {
                                const ddx = pts[id].x - qx, ddz = pts[id].z - qz;
                                if (ddx * ddx + ddz * ddz < rSq) { ok = false; break; }
                            }
                        }
                    }
                    if (!ok) continue;
                    const newIdx = pts.length;
                    pts.push({ x: qx, z: qz });
                    grid[gz * gw + gx] = newIdx;
                    active.push(newIdx);
                    found = true;
                    break;
                }
                if (!found) {
                    active[ai] = active[active.length - 1];
                    active.pop();
                }
            }
            return pts;
        }

        function addConeWithCap(cx, cy, cz, y0, h, rad, sides, col, scaleXZ, scaleY, yawRad) {
            const apex = { x: cx, y: cy + (y0 + h) * scaleY, z: cz };
            const capInset = Math.min(h * 0.20, rad * 0.24);
            const capCenter = { x: cx, y: cy + (y0 + capInset) * scaleY, z: cz };
            const edgeUnderCol = shadeColor(col, -0.05);
            const innerUnderCol = shadeColor(col, -0.20);
            const ring = [];
            for (let s = 0; s < sides; s++) {
                const a = yawRad + (s * Math.PI * 2.0) / sides;
                ring.push({ x: cx + Math.cos(a) * rad * scaleXZ, y: cy + y0 * scaleY, z: cz + Math.sin(a) * rad * scaleXZ });
            }
            for (let s = 0; s < sides; s++) {
                const p0 = ring[s], p1 = ring[(s + 1) % sides];
                const out = { x: (p0.x + p1.x) * 0.5 - cx, y: 0.35, z: (p0.z + p1.z) * 0.5 - cz };
                vegMb.tri(p0, p1, apex, col, col, col, out, 1.0);
                vegMb.tri(p1, p0, capCenter, edgeUnderCol, edgeUnderCol, innerUnderCol, { x: 0, y: -1, z: 0 }, 1.0);
            }
        }

        function addPrism(cx, cy, cz, y0, y1, rBot, rTop, sides, col, scaleXZ, scaleY) {
            for (let s = 0; s < sides; s++) {
                const a0 = (s * Math.PI * 2.0) / sides, a1 = ((s + 1) * Math.PI * 2.0) / sides;
                const b0 = { x: cx + Math.cos(a0) * rBot * scaleXZ, y: cy + y0 * scaleY, z: cz + Math.sin(a0) * rBot * scaleXZ };
                const b1 = { x: cx + Math.cos(a1) * rBot * scaleXZ, y: cy + y0 * scaleY, z: cz + Math.sin(a1) * rBot * scaleXZ };
                const t0 = { x: cx + Math.cos(a0) * rTop * scaleXZ, y: cy + y1 * scaleY, z: cz + Math.sin(a0) * rTop * scaleXZ };
                const t1 = { x: cx + Math.cos(a1) * rTop * scaleXZ, y: cy + y1 * scaleY, z: cz + Math.sin(a1) * rTop * scaleXZ };
                const out = { x: Math.cos((a0 + a1) * 0.5), y: 0, z: Math.sin((a0 + a1) * 0.5) };
                vegMb.quad(b0, b1, t1, t0, col, col, col, col, out, 1.0);
            }
        }

        // ---- 8.1 木の生成 (`BuildTrees`: groveNoise と microGap で森の中に濃い木立と薄い疎林を作る) ----
        const minTreeNy = Math.max(0.74, islCfg.rockSlope + 0.02);
        const treeMinDist = islCfg.treeMinDist !== undefined ? islCfg.treeMinDist : 3.4;
        const treeSpacing = Math.max(1.5, treeMinDist * 0.68);
        // 小島のサイズに合わせて林の塊(grove)と小さな隙間(microGap)の空間波長をスケーリング
        const groveFreq = 3.2 / Math.max(18.0, half);
        const microGapFreq = 9.5 / Math.max(18.0, half);

        if (forestSpread > 0.01) {
            const treeCandidates = poissonSample2D(treeSpacing);
            for (const p of treeCandidates) {
                const bw = BiomeWeights(p.x, p.z);
                if (bw.forest <= 0.02) continue;

                const surf = sampleContinuousSurface(p.x, p.z, 2.2);
                if (!surf || surf.wet || surf.trailW > 0.22 || surf.ny < minTreeNy) continue;
                if ((surf.y + oy) > sharedWorldGreeneryLine - 1.5) continue;

                // 密生する濃い木立と、開けた薄い疎林が混ざるよう中・高周波ノイズで局所密度を変化させる (`FloatingTerrainBuilder.cs` 準拠)
                const groveNoise = perlin.fbm(p.x * groveFreq + 2.7, p.z * groveFreq - 5.1, 10, 1.0, 3);
                const microGap = perlin.fbm(p.x * microGapFreq - 4.3, p.z * microGapFreq + 1.9, 12, 1.0, 2);
                const combinedGrove = groveNoise * 0.68 + microGap * 0.32;
                const localDensity = 0.08 + 0.92 * smoothstep(0.26, 0.70, combinedGrove);
                if (vr.next() > bw.forest * localDensity) continue;

                const baseScale = 0.80 + vr.next() * 0.42;
                const hBias = 0.90 + vr.next() * 0.22;
                const wBias = 0.88 + vr.next() * 0.34;
                const sY = islCfg.treeScale * baseScale * hBias;
                const sXZ = islCfg.treeScale * baseScale * wBias;
                const crownStart = 1.25 + vr.next() * 0.85;
                const span = 3.95 + vr.next() * 0.75;
                const lowerRadScale = 0.95 + vr.next() * 0.16;
                const g = vr.range(-0.05, 0.05);

                const wx = p.x + ox, wz = p.z + oz, wy = surf.y + oy - 0.18 * sY;
                const trunkTop = Math.max(2.1, crownStart + 0.55);
                addPrism(wx, wy, wz, -0.2, trunkTop, 0.22, 0.12, 6, palette.trunk, sXZ, sY);

                const r1 = 1.32 * lowerRadScale;
                const r2 = 1.02 * (0.94 + vr.next() * 0.16);
                const r3 = 0.70 * (0.94 + vr.next() * 0.16);
                addConeWithCap(wx, wy, wz, crownStart, span * 0.54, r1, 7, shadeColor(palette.leaf, g), sXZ, sY, vr.next() * 6.28);
                addConeWithCap(wx, wy, wz, crownStart + span * 0.28, span * 0.49, r2, 7, shadeColor(palette.leaf, g + 0.03), sXZ, sY, vr.next() * 6.28);
                addConeWithCap(wx, wy, wz, crownStart + span * 0.55, span * 0.45, r3, 7, shadeColor(palette.leaf, g + 0.06), sXZ, sY, vr.next() * 6.28);
                treeCount++;
            }
        }

        // ---- 8.2 草の生成 (`BuildGrassMesh`: 草原エリアに高密度で配置し、bare領域は何も生えない緑の地面として残す) ----
        function addGrassBlade(r0Pt, r1Pt, rootMid, dir, side, widthBlade, heightBlade, lean, rootCol, midCol, tipCol) {
            const midCenter = {
                x: rootMid.x + dir.x * (lean * 0.32),
                y: rootMid.y + heightBlade * 0.55,
                z: rootMid.z + dir.z * (lean * 0.32)
            };
            const halfMidW = widthBlade * 0.42;
            const m0 = { x: midCenter.x - side.x * halfMidW, y: midCenter.y, z: midCenter.z - side.z * halfMidW };
            const m1 = { x: midCenter.x + side.x * halfMidW, y: midCenter.y, z: midCenter.z + side.z * halfMidW };
            const tip = {
                x: rootMid.x + dir.x * lean,
                y: rootMid.y + heightBlade,
                z: rootMid.z + dir.z * lean
            };
            const out = { x: -dir.x, y: 0.45, z: -dir.z };
            vegMb.tri(r0Pt, r1Pt, m1, rootCol, rootCol, midCol, out, 1.0);
            vegMb.tri(r0Pt, m1, m0, rootCol, midCol, midCol, out, 1.0);
            vegMb.tri(m0, m1, tip, midCol, midCol, tipCol, out, 1.0);
            // 裏面も描画してどの角度から見ても草の密度が高く見えるようにする
            const backOut = { x: dir.x, y: 0.45, z: dir.z };
            vegMb.tri(r1Pt, r0Pt, m0, rootCol, rootCol, midCol, backOut, 1.0);
            vegMb.tri(r1Pt, m0, m1, rootCol, midCol, midCol, backOut, 1.0);
            vegMb.tri(m1, m0, tip, midCol, midCol, tipCol, backOut, 1.0);
        }

        const grassMinDist = islCfg.grassMinDist !== undefined ? islCfg.grassMinDist : 1.0;
        const grassDensity = islCfg.grassDensity !== undefined ? islCfg.grassDensity : 2.8;
        if (grassDensity > 0.05 && meadowSpread > 0.01) {
            const grassSpacing = clamp(grassMinDist / Math.max(0.55, grassDensity * 0.92), 0.42, 2.2);
            const minGrassNy = Math.max(0.84, islCfg.rockSlope + 0.10);
            const patchFreq = 5.5 / Math.max(18.0, half);
            const fineFreq = 14.0 / Math.max(18.0, half);

            const grassCandidates = poissonSample2D(grassSpacing);
            for (const p of grassCandidates) {
                const bw = BiomeWeights(p.x, p.z);
                // 草原バイオーム (bw.meadow) のみに草を生やし、bare領域は「何も生えていない緑の地面」として残す
                if (bw.meadow <= 0.015) continue;

                const surf = sampleContinuousSurface(p.x, p.z, 1.6);
                if (!surf || surf.wet || surf.trailW > 0.18 || surf.ny < minGrassNy || surf.steepD < grassSlopeMargin) continue;

                const worldY = surf.y + oy;
                const barrenW = smoothstep(sharedWorldGreeneryLine - 3.5, sharedWorldGreeneryLine + 2.5, worldY);
                if (barrenW > 0.68) continue;

                const slopeMarginW = smoothstep(grassSlopeMargin, grassSlopeMargin + 2.4, surf.steepD);
                const flatnessW = smoothstep(minGrassNy, minGrassNy + 0.06, surf.ny);
                const altFade = 1.0 - smoothstep(0.05, 0.72, barrenW);
                const rawCover = bw.meadow * altFade * Math.min(slopeMarginW, flatnessW);

                // 草原の境界帯を大小の草株・飛び地へ砕き、中心部は高密度に茂らせる (`FloatingTerrainBuilder.cs` 準拠)
                const patchNoise = perlin.fbm(p.x * patchFreq + 5.1, p.z * patchFreq - 3.7, 6, 1.0, 2);
                const fineNoise = perlin.fbm(p.x * fineFreq - 2.3, p.z * fineFreq + 6.4, 4, 1.0, 1);
                const breakup = patchNoise * 0.68 + fineNoise * 0.32;
                const edgeMask = smoothstep(0.16, 0.82, rawCover + (breakup - 0.5) * 0.68);
                const cover = edgeMask + (rawCover - edgeMask) * (rawCover * rawCover);
                if (cover <= 0.02) continue;

                if (vr.next() > Math.pow(cover, 1.65) * 0.98) continue;

                const clumpScale = 0.76 + vr.next() * 0.68;
                const clumpVar = vr.range(-0.08, 0.08);
                const minBlades = cover < 0.28 ? 2 : (cover < 0.58 ? 3 : 4);
                const maxBlades = cover < 0.28 ? 3 : (cover < 0.58 ? 4 : 5);
                const bladeCount = minBlades + Math.floor(vr.next() * (maxBlades - minBlades + 1));
                const tintMix = 0.45 + 0.55 * smoothstep(0.02, 0.42, cover);

                const invNy = surf.normal.y > 0.15 ? 1.0 / surf.normal.y : 1.0;
                const slopeX = -surf.normal.x * invNy;
                const slopeZ = -surf.normal.z * invNy;

                for (let k = 0; k < bladeCount; k++) {
                    const angle = (k + vr.next() * 0.75) * (Math.PI * 2.0 / bladeCount);
                    const dir = { x: Math.cos(angle), y: 0, z: Math.sin(angle) };
                    const side = { x: -dir.z, y: 0, z: dir.x };
                    const rootOffset = (0.04 + vr.next() * 0.20) * clumpScale;

                    const tallBlade = k < 2;
                    const bladeH = (tallBlade ? 0.78 + vr.next() * 0.42 : 0.42 + vr.next() * 0.38) * clumpScale;
                    const widthBlade = (0.082 + vr.next() * 0.042) * clumpScale;
                    const lean = bladeH * (tallBlade ? 0.28 + vr.next() * 0.34 : 0.34 + vr.next() * 0.40);
                    const bladeVar = vr.range(-0.05, 0.05);

                    const rx = p.x + dir.x * rootOffset;
                    const rz = p.z + dir.z * rootOffset;
                    const halfW = widthBlade * 0.55;
                    const rootY = surf.y + (rx - p.x) * slopeX + (rz - p.z) * slopeZ;
                    const sxOff = side.x * halfW * slopeX;
                    const szOff = side.z * halfW * slopeZ;
                    const y0 = rootY - sxOff - szOff;
                    const y1 = rootY + sxOff - szOff;

                    const embedDepth = 0.10;
                    const r0Pt = { x: rx - side.x * halfW + ox, y: y0 - embedDepth + oy, z: rz - side.z * halfW + oz };
                    const r1Pt = { x: rx + side.x * halfW + ox, y: y1 - embedDepth + oy, z: rz + side.z * halfW + oz };
                    const baseY = Math.min(rootY, Math.min(y0, y1)) - embedDepth;
                    const rootMid = { x: rx + ox, y: baseY + oy, z: rz + oz };

                    const rootCol = shadeColor(palette.grass, -0.28 * tintMix + clumpVar);
                    const midCol = shadeColor(palette.grass, -0.06 * tintMix + clumpVar + bladeVar);
                    const tipBase = shadeColor(palette.grass, 0.08 * tintMix + clumpVar + bladeVar);
                    const tipCol = lerpColor(tipBase, palette.sand, (tallBlade ? 0.28 : 0.15) * tintMix);

                    addGrassBlade(r0Pt, r1Pt, rootMid, dir, side, widthBlade, bladeH, lean, rootCol, midCol, tipCol);
                }
                grassClumpCount++;
            }
        }

        const segmentVisuals = routeSegments.map(s => {
            const pFrom = s.fromResolved.worldPos;
            const pTo = s.toResolved.worldPos;
            const tunPts = s.mode === 'tunnel' ? tunnelCurveBySegKey.get(s.segKey) : null;
            const midNode = s.nodes.length > 0 ? s.nodes[Math.floor(s.nodes.length / 2)] : -1;
            const pMid = (s.mode === 'trail' && midNode >= 0)
                ? Pos(midNode, H[midNode])
                : (tunPts && tunPts.length >= 2
                    ? tunPts[Math.floor(tunPts.length / 2)]
                    : { x: (pFrom.x + pTo.x) * 0.5, y: (pFrom.y + pTo.y) * 0.5 + (s.mode === 'tunnel' ? 1.8 : 0.6), z: (pFrom.z + pTo.z) * 0.5 });
            return {
                segKey: s.segKey,
                mode: s.mode,
                enabled: s.mode !== 'none',
                isBranch: Boolean(s.isBranch),
                midPos: pMid,
                pathPts: s.mode === 'tunnel' && tunPts ? tunPts : s.nodes.map(nd => Pos(nd, H[nd])),
                fromPos: pFrom,
                toPos: pTo
            };
        });

        return {
            name: islCfg.name,
            seed: islCfg.seed,
            resolution,
            cellSize,
            half,
            xz,
            H,
            inside,
            mountain,
            ox, oy, oz,
            terrainMb,
            waterMb,
            vegMb,
            entryShorePos: entryResolved.worldPos,
            entryGroundY: entryResolved.groundWorldY,
            exitShorePos: exitResolved.worldPos,
            exitGroundY: exitResolved.groundWorldY,
            waypointWorldPositions: waypointResolved.map(r => r.worldPos),
            waypointGroundYs: waypointResolved.map(r => r.groundWorldY),
            waypointRoles,
            branchPointRoles,
            resolvedBranches,
            segmentVisuals,
            internalBridges,
            allTunnels,
            lakeCount: keptLakes,
            waterVertCount,
            treeCount,
            grassClumpCount
        };
    }

    // =========================================================================
    // 6. `BridgeGeneratorWindow.cs` (`BridgeMeshGenerator`) 忠実移植 (3D高さ支柱対応)
    // =========================================================================
    function buildBridgePlanks(startPt, endPt, width, sag, irregularity, woodColor, bridgeSeed, startGroundY, endGroundY) {
        const mb = new ColoredMeshBuilder();
        const dx = endPt.x - startPt.x;
        const dz = endPt.z - startPt.z;
        const length = Math.hypot(dx, dz);
        if (length < 0.5) return { mb, midPos: startPt };

        const rise = endPt.y - startPt.y;
        const panels = Math.max(3, Math.ceil(Math.hypot(length, rise) / 0.42));
        const half = width * 0.5;
        const random = new SeededRandom(bridgeSeed || 12345);
        const colorRandom = new SeededRandom((bridgeSeed || 12345) + 2);
        const gap = 0.08;
        const colorVariation = 0.22;

        const dirX = dx / length, dirZ = dz / length;
        const rightX = dirZ, rightZ = -dirX;

        function getPointLocal(t) {
            return {
                x: 0,
                y: rise * t - 4.0 * t * (1.0 - t) * sag,
                z: length * t
            };
        }
        function toWorld(lx, ly, lz) {
            return {
                x: startPt.x + rightX * lx + dirX * lz,
                y: startPt.y + ly,
                z: startPt.z + rightZ * lx + dirZ * lz
            };
        }

        // 橋の端点が3次元指定で地表より高い位置に持ち上げられている場合、地面まで木製の支柱（橋脚）を生成する
        function addSupportTrestle(endWorldPt, groundY) {
            if (!Number.isFinite(groundY)) return;
            const hDiff = endWorldPt.y - groundY;
            if (hDiff <= 0.45) return;
            const postCol = shadeColor(woodColor, -0.18);
            const postR = 0.11;
            const postOffsets = [-half * 0.78, half * 0.78];
            for (const lat of postOffsets) {
                const px = endWorldPt.x + rightX * lat;
                const pz = endWorldPt.z + rightZ * lat;
                const yBot = groundY - 0.35;
                const yTop = endWorldPt.y + 0.25;
                for (let s = 0; s < 4; s++) {
                    const a0 = (s + 0.5) * Math.PI * 0.5;
                    const a1 = (s + 1.5) * Math.PI * 0.5;
                    const c0 = Math.cos(a0) * postR, s0 = Math.sin(a0) * postR;
                    const c1 = Math.cos(a1) * postR, s1 = Math.sin(a1) * postR;
                    mb.quad(
                        { x: px + c0, y: yBot, z: pz + s0 },
                        { x: px + c1, y: yBot, z: pz + s1 },
                        { x: px + c1, y: yTop, z: pz + s1 },
                        { x: px + c0, y: yTop, z: pz + s0 },
                        postCol, postCol, postCol, postCol,
                        { x: c0 + c1, y: 0, z: s0 + s1 }, 1.0
                    );
                }
            }
        }
        addSupportTrestle(startPt, startGroundY);
        addSupportTrestle(endPt, endGroundY);

        for (let i = 0; i < panels; i++) {
            const a = i / panels, b = (i + 1) / panels;
            const p = getPointLocal(a), q = getPointLocal(b);
            const segDy = q.y - p.y, segDz = q.z - p.z;
            const segLen = Math.hypot(segDy, segDz) || 0.4;
            const fwdY = segDy / segLen, fwdZ = segDz / segLen;
            const upY = fwdZ, upZ = -fwdY;

            const brightness = 1.0 + colorRandom.signed() * colorVariation;
            const plankCol = shadeColor(woodColor, brightness - 1.0);
            const sideCol = shadeColor(plankCol, -0.12);

            const variation = irregularity;
            const offset = random.signed() * half * 0.16 * variation;
            const plankHalfWidth = half * (1.0 + random.signed() * 0.10 * variation);
            const plankHalfLength = Math.max(0.05, segLen - gap) * 0.5 * (1.0 + random.signed() * 0.10 * variation);
            const angle = random.signed() * 4.0 * variation * (Math.PI / 180.0);
            const cosA = Math.cos(angle), sinA = Math.sin(angle);

            const xAxis = { x: cosA, y: fwdY * sinA, z: fwdZ * sinA };
            const zAxis = { x: -sinA, y: fwdY * cosA, z: fwdZ * cosA };
            const center = { x: offset, y: (p.y + q.y) * 0.5, z: (p.z + q.z) * 0.5 };
            const thick = { x: 0, y: upY * 0.12, z: upZ * 0.12 };

            const top = [], bot = [];
            for (let c = 0; c < 4; c++) {
                const sx = c < 2 ? -1.0 : 1.0;
                const sz = (c === 0 || c === 3) ? -1.0 : 1.0;
                const u = sx * plankHalfWidth + random.signed() * half * 0.035 * variation;
                const v = sz * plankHalfLength + random.signed() * plankHalfLength * 0.07 * variation;
                const lx = center.x + xAxis.x * u + zAxis.x * v;
                const ly = center.y + xAxis.y * u + zAxis.y * v;
                const lz = center.z + xAxis.z * u + zAxis.z * v;
                top.push(toWorld(lx, ly, lz));
                bot.push(toWorld(lx - thick.x, ly - thick.y, lz - thick.z));
            }
            mb.quad(top[0], top[1], top[2], top[3], plankCol, plankCol, plankCol, plankCol, { x: 0, y: 1, z: 0 }, 1.0);
            mb.quad(bot[3], bot[2], bot[1], bot[0], sideCol, sideCol, sideCol, sideCol, { x: 0, y: -1, z: 0 }, 1.0);
            for (let s = 0; s < 4; s++) {
                const nxt = (s + 1) % 4;
                mb.quad(top[s], bot[s], bot[nxt], top[nxt], sideCol, sideCol, sideCol, sideCol, null, 1.0);
            }
        }

        const midLocal = getPointLocal(0.5);
        return { mb, midPos: toWorld(0, midLocal.y, midLocal.z) };
    }

    // =========================================================================
    // 7. 群島全体の統合ビルド & シーン構築
    // =========================================================================
    const showFlags = {
        wire: false,
        water: true,
        veg: true
    };

    function buildArchipelagoStage() {
        const palette = {
            grass: hexToRgb(state.grassColor),
            forest: hexToRgb(state.forestGroundColor),
            sand: hexToRgb(state.sandColor),
            rock: hexToRgb(state.rockColor),
            snow: hexToRgb(state.snowColor),
            under: hexToRgb(state.underColor),
            water: hexToRgb(state.waterColor),
            trunk: hexToRgb(state.trunkColor),
            leaf: hexToRgb(state.leafColor),
            wood: hexToRgb(state.woodColor)
        };

        const builtIslands = [];
        for (let i = 0; i < state.islands.length; i++) {
            const prevCfg = i > 0 ? state.islands[i - 1] : null;
            const nextCfg = i + 1 < state.islands.length ? state.islands[i + 1] : null;
            builtIslands.push(buildSingleIsland(state.islands[i], prevCfg, nextCfg, palette));
        }

        const allBridgeMb = new ColoredMeshBuilder();
        const builtBridges = [];

        for (let i = 0; i < builtIslands.length; i++) {
            const isl = builtIslands[i];
            // 島内の渡河小橋
            if (!routeEditState.soloIsland || i === state.selectedIslandIdx) {
                for (let bIdx = 0; bIdx < isl.internalBridges.length; bIdx++) {
                    const ib = isl.internalBridges[bIdx];
                    const brSag = ib.sag !== undefined ? ib.sag : 0.22;
                    const br = buildBridgePlanks(
                        ib.start, ib.end,
                        Math.max(1.18, state.bridgeWidth * 0.85), brSag,
                        state.bridgeIrregularity * 0.55, palette.wood,
                        isl.seed + 50 + bIdx,
                        ib.startGroundY, ib.endGroundY
                    );
                    for (let k = 0; k < br.mb.v.length; k++) {
                        allBridgeMb.v.push(br.mb.v[k]);
                        allBridgeMb.c.push(br.mb.c[k]);
                        allBridgeMb.a.push(br.mb.a[k]);
                    }
                    builtBridges.push({ start: ib.start, end: ib.end, mid: br.midPos, islandIdx: i });
                }
            }

            // 次の島への連結吊り橋
            const islCfg = state.islands[i];
            if (!routeEditState.soloIsland && i + 1 < builtIslands.length && islCfg.hasBridgeToNext !== false) {
                const nextIsl = builtIslands[i + 1];
                const shoreA = isl.exitShorePos;
                const shoreB = nextIsl.entryShorePos;
                const br = buildBridgePlanks(
                    shoreA, shoreB,
                    state.bridgeWidth, state.bridgeSag, state.bridgeIrregularity,
                    palette.wood, 12345 + i * 77,
                    isl.exitGroundY, nextIsl.entryGroundY
                );
                for (let k = 0; k < br.mb.v.length; k++) {
                    allBridgeMb.v.push(br.mb.v[k]);
                    allBridgeMb.c.push(br.mb.c[k]);
                    allBridgeMb.a.push(br.mb.a[k]);
                }
                builtBridges.push({ start: shoreA, end: shoreB, mid: br.midPos, isInterIsland: true, islandIdx: i });
            }
        }

        const firstIsl = builtIslands[0];
        const lastIsl = builtIslands[builtIslands.length - 1];

        return {
            builtIslands,
            builtBridges,
            allBridgeMb,
            spawnPos: firstIsl ? firstIsl.entryShorePos : { x: 0, y: 10, z: 0 },
            goalPos: lastIsl ? lastIsl.exitShorePos : { x: 0, y: 20, z: -40 }
        };
    }

    function createGizmoGroup(arch) {
        const g = new THREE.Group();
        routeHandleMeshes.length = 0;
        segmentToggleMeshes.length = 0;

        const sp = arch.spawnPos;
        const spawnMat = new THREE.LineBasicMaterial({ color: 0x26e6ff, transparent: true, opacity: 0.5 });

        function makeDisc(cx, cy, cz, r, mat) {
            const pts = [];
            for (let i = 0; i <= 24; i++) {
                const a = (i / 24) * Math.PI * 2;
                pts.push(new THREE.Vector3(cx + Math.cos(a) * r, cy, cz + Math.sin(a) * r));
            }
            return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat);
        }
        if (!routeEditState.soloIsland || state.selectedIslandIdx === 0) {
            g.add(makeDisc(sp.x, sp.y + 0.05, sp.z, 0.55, spawnMat));
            g.add(makeDisc(sp.x, sp.y + 1.75, sp.z, 0.55, spawnMat));
        }

        const gp = arch.goalPos;
        if (!routeEditState.soloIsland || state.selectedIslandIdx === arch.builtIslands.length - 1) {
            const goalBeacon = new THREE.Mesh(
                new THREE.OctahedronGeometry(0.95, 0),
                new THREE.MeshBasicMaterial({ color: 0xc084fc, transparent: true, opacity: 0.42, depthWrite: false })
            );
            goalBeacon.position.set(gp.x, gp.y + 2.4, gp.z);
            g.add(goalBeacon);
        }

        // 各島のドラッグ可能なルート＆橋アンカー球と、区間ごとの切断/接続ダイヤモンドマーカー
        arch.builtIslands.forEach((isl, islIdx) => {
            if (routeEditState.soloIsland && islIdx !== state.selectedIslandIdx) return;

            function addHandleSphere(worldPos, colorHex, role, wpIdx = -1, radius = 1.15, groundY = null) {
                const isSelectedIsl = (islIdx === state.selectedIslandIdx);
                const sel = routeEditState.selectedGizmo;
                const isSelectedHandle = Boolean(
                    sel && sel.islandIdx === islIdx && sel.role === role && String(sel.wpIdx) === String(wpIdx)
                );
                const rFinal = (isSelectedIsl ? radius * 1.18 : radius * 0.9) * (isSelectedHandle ? 1.2 : 1.0);
                const sphereGeo = new THREE.SphereGeometry(rFinal, 16, 14);
                const sphereMat = new THREE.MeshBasicMaterial({
                    color: isSelectedHandle ? 0xffffff : colorHex,
                    transparent: true,
                    opacity: isSelectedHandle ? 0.62 : (isSelectedIsl ? 0.44 : 0.26),
                    depthWrite: false
                });
                const handle = new THREE.Mesh(sphereGeo, sphereMat);
                handle.position.set(worldPos.x, worldPos.y + 1.15, worldPos.z);
                handle.userData = { isRouteHandle: true, islandIdx: islIdx, role, wpIdx };
                g.add(handle);
                routeHandleMeshes.push(handle);

                const basePinY = Number.isFinite(groundY) ? Math.min(groundY, worldPos.y) : worldPos.y;
                const pinPts = [
                    new THREE.Vector3(worldPos.x, basePinY, worldPos.z),
                    new THREE.Vector3(worldPos.x, worldPos.y + 1.15, worldPos.z)
                ];
                g.add(new THREE.Line(
                    new THREE.BufferGeometry().setFromPoints(pinPts),
                    new THREE.LineBasicMaterial({
                        color: isSelectedHandle ? 0xffffff : colorHex,
                        transparent: true,
                        opacity: isSelectedHandle ? 0.65 : 0.42
                    })
                ));
            }

            addHandleSphere(isl.entryShorePos, 0x22c55e, 'entry', -1, 1.25, isl.entryGroundY);

            function roleToColor(role, fallbackHex) {
                if (role === 'bridgeStart') return 0x38bdf8;
                if (role === 'bridgeEnd') return 0x3b82f6;
                if (role === 'tunnelStart') return 0xf97316;
                if (role === 'tunnelEnd') return 0xef4444;
                return fallbackHex;
            }

            isl.waypointWorldPositions.forEach((wpPos, wIdx) => {
                const roleTag = (isl.waypointRoles && isl.waypointRoles[wIdx]) || 'waypoint';
                const col = roleToColor(roleTag, 0xfacc15);
                const rad = (roleTag !== 'waypoint') ? 1.18 : 1.05;
                const gY = isl.waypointGroundYs ? isl.waypointGroundYs[wIdx] : null;
                addHandleSphere(wpPos, col, 'waypoint', wIdx, rad, gY);
            });
            addHandleSphere(isl.exitShorePos, 0xa855f7, 'exit', -1, 1.25, isl.exitGroundY);

            // 分岐道 (`resolvedBranches`) の各経由点・終点・自由起点ハンドル
            if (isl.resolvedBranches) {
                isl.resolvedBranches.forEach((br, bIdx) => {
                    if (br.hasCustomStart) {
                        addHandleSphere(br.startWorld, 0xf472b6, 'branchStart', br.bIdx, 0.98, br.startGroundY);
                    }
                    br.pointWorlds.forEach((ptW, ptIdx) => {
                        const isLast = (ptIdx === br.pointWorlds.length - 1);
                        const brRole = (isl.branchPointRoles && isl.branchPointRoles[bIdx]) ? isl.branchPointRoles[bIdx][ptIdx] : 'branch';
                        const col = roleToColor(brRole, isLast ? 0xec4899 : 0xf472b6);
                        const gY = br.pointGroundYs ? br.pointGroundYs[ptIdx] : null;
                        addHandleSphere(ptW, col, 'branchPoint', `${br.bIdx}_${ptIdx}`, isLast ? 1.12 : 0.98, gY);
                    });
                });
            }

            // 区間（セグメント）単位のラインと、クリックで区間選択・種別切替できるダイヤモンドマーカー
            if (isl.segmentVisuals) {
                isl.segmentVisuals.forEach(sv => {
                    const sel = routeEditState.selectedGizmo;
                    const isSelSeg = Boolean(sel && sel.islandIdx === islIdx && sel.role === 'segment' && sel.segKey === sv.segKey);

                    if (sv.mode === 'trail' && sv.pathPts.length >= 2) {
                        const pts = sv.pathPts.map(p => new THREE.Vector3(p.x, p.y + 0.35, p.z));
                        g.add(new THREE.Line(
                            new THREE.BufferGeometry().setFromPoints(pts),
                            new THREE.LineBasicMaterial({
                                color: sv.isBranch ? 0xf472b6 : 0xfacc15,
                                transparent: true,
                                opacity: 0.55
                            })
                        ));
                    } else if (sv.mode === 'bridge' || sv.mode === 'tunnel') {
                        const pts = (sv.mode === 'tunnel' && sv.pathPts && sv.pathPts.length >= 2)
                            ? sv.pathPts.map(p => new THREE.Vector3(p.x, p.y, p.z))
                            : [
                                new THREE.Vector3(sv.fromPos.x, sv.fromPos.y + 0.5, sv.fromPos.z),
                                new THREE.Vector3(sv.toPos.x, sv.toPos.y + 0.5, sv.toPos.z)
                            ];
                        g.add(new THREE.Line(
                            new THREE.BufferGeometry().setFromPoints(pts),
                            new THREE.LineBasicMaterial({
                                color: sv.mode === 'bridge' ? 0x38bdf8 : 0xf97316,
                                transparent: true,
                                opacity: 0.52
                            })
                        ));
                    } else {
                        const pts = [
                            new THREE.Vector3(sv.fromPos.x, sv.fromPos.y + 0.6, sv.fromPos.z),
                            new THREE.Vector3(sv.toPos.x, sv.toPos.y + 0.6, sv.toPos.z)
                        ];
                        g.add(new THREE.Line(
                            new THREE.BufferGeometry().setFromPoints(pts),
                            new THREE.LineBasicMaterial({ color: 0x64748b, transparent: true, opacity: 0.28 })
                        ));
                    }

                    // 中点の「◆区間種別マーカー」
                    const diaColor = isSelSeg ? 0xffffff
                        : (sv.mode === 'bridge' ? 0x3b82f6
                        : (sv.mode === 'tunnel' ? 0xf97316
                        : (sv.mode === 'none' ? 0xef4444 : 0x38bdf8)));
                    const diaGeo = new THREE.OctahedronGeometry(isSelSeg ? 0.96 : 0.78, 0);
                    const diaMat = new THREE.MeshBasicMaterial({
                        color: diaColor,
                        transparent: true,
                        opacity: isSelSeg ? 0.62 : (sv.mode === 'none' ? 0.28 : 0.44),
                        depthWrite: false
                    });
                    const diaMesh = new THREE.Mesh(diaGeo, diaMat);
                    diaMesh.position.set(sv.midPos.x, sv.midPos.y + 1.45, sv.midPos.z);
                    diaMesh.userData = { isSegmentToggle: true, islandIdx: islIdx, segKey: sv.segKey };
                    g.add(diaMesh);
                    segmentToggleMeshes.push(diaMesh);
                });
            }
        });

        return g;
    }

    // 3D画面上のダイヤをクリックで区間を強調表示（選択済みを再クリックで 道→橋→トンネル→切断 を切替）
    function tryToggleSegmentOnClick(e) {
        if (!builtArchipelago || segmentToggleMeshes.length === 0) return false;
        raycaster.setFromCamera(getNdcMouse(e), camera);
        const hits = raycaster.intersectObjects(segmentToggleMeshes, false);
        if (hits.length === 0) return false;

        const ud = hits[0].object.userData;
        state.selectedIslandIdx = ud.islandIdx;
        const islCfg = state.islands[ud.islandIdx];
        if (!islCfg.segmentTypes) islCfg.segmentTypes = {};

        const prevSel = routeEditState.selectedGizmo;
        const alreadySelected = Boolean(prevSel && prevSel.islandIdx === ud.islandIdx && prevSel.role === 'segment' && prevSel.segKey === ud.segKey);
        const order = ['trail', 'bridge', 'tunnel', 'none'];
        const curMode = islCfg.segmentTypes[ud.segKey] || 'trail';

        if (alreadySelected) {
            const nextMode = order[(order.indexOf(curMode) + 1) % order.length];
            islCfg.segmentTypes[ud.segKey] = nextMode;
            const modeName = nextMode === 'bridge' ? '橋' : (nextMode === 'tunnel' ? 'トンネル' : (nextMode === 'none' ? '切断' : '道'));
            showToast(`区間を「${modeName}」に切り替えました`);
        } else {
            showToast(`区間を選択しました（右リストまたは再クリックで 道/橋/トンネル/切断 を切替）`);
        }

        rebuildScene();
        selectAndHighlightGizmo({ islandIdx: ud.islandIdx, role: 'segment', wpIdx: -1, segKey: ud.segKey }, true);
        return true;
    }

    // 3D画面上でのルート・橋アンカー球のドラッグ＆ダブルクリック追加
    function getNdcMouse(e) {
        const rect = canvas.getBoundingClientRect();
        return new THREE.Vector2(
            ((e.clientX - rect.left) / rect.width) * 2 - 1,
            -((e.clientY - rect.top) / rect.height) * 2 + 1
        );
    }

    function tryBeginDragRouteHandle(e) {
        if (!builtArchipelago || routeHandleMeshes.length === 0) return false;
        raycaster.setFromCamera(getNdcMouse(e), camera);
        const hits = raycaster.intersectObjects(routeHandleMeshes, false);
        if (hits.length === 0) return false;

        const ud = hits[0].object.userData;
        state.selectedIslandIdx = ud.islandIdx;
        routeEditState.draggingHandle = {
            islandIdx: ud.islandIdx,
            role: ud.role,
            wpIdx: ud.wpIdx,
            lastClientY: e.clientY
        };
        selectAndHighlightGizmo({
            islandIdx: ud.islandIdx,
            role: ud.role,
            wpIdx: ud.wpIdx
        }, true);
        rebuildScene();
        return true;
    }

    function handleDragRouteHandleMove(e) {
        const drag = routeEditState.draggingHandle;
        if (!drag || !builtArchipelago) return;
        const isl = builtArchipelago.builtIslands[drag.islandIdx];
        if (!isl || !isl.terrainMeshObj) return;
        const islCfg = state.islands[drag.islandIdx];

        // Shiftキーを押しながらドラッグすると、各ポイント（入口・経由点・分岐点・出口）の3次元高さ(yOffset)を上下に変更できる
        if (e.shiftKey) {
            const dyPx = (drag.lastClientY !== undefined ? drag.lastClientY : e.clientY) - e.clientY;
            drag.lastClientY = e.clientY;
            const deltaY = dyPx * 0.12;
            const adjustYOffset = (obj) => {
                if (!obj) return;
                obj.yOffset = Number(clamp((obj.yOffset || 0) + deltaY, -18.0, 35.0).toFixed(2));
            };
            if (drag.role === 'entry') adjustYOffset(islCfg.entryNorm);
            else if (drag.role === 'exit') adjustYOffset(islCfg.exitNorm);
            else if (drag.role === 'waypoint' && islCfg.waypointsNorm && islCfg.waypointsNorm[drag.wpIdx]) {
                adjustYOffset(islCfg.waypointsNorm[drag.wpIdx]);
            } else if (drag.role === 'branchStart' && islCfg.branches && islCfg.branches[drag.wpIdx]) {
                adjustYOffset(islCfg.branches[drag.wpIdx].startNorm);
            } else if (drag.role === 'branchPoint' && typeof drag.wpIdx === 'string') {
                const [bIdxStr, ptIdxStr] = drag.wpIdx.split('_');
                const bIdx = parseInt(bIdxStr, 10), ptIdx = parseInt(ptIdxStr, 10);
                if (islCfg.branches && islCfg.branches[bIdx] && islCfg.branches[bIdx].pointsNorm && islCfg.branches[bIdx].pointsNorm[ptIdx]) {
                    adjustYOffset(islCfg.branches[bIdx].pointsNorm[ptIdx]);
                }
            }
            rebuildScene();
            return;
        }
        drag.lastClientY = e.clientY;

        raycaster.setFromCamera(getNdcMouse(e), camera);
        const hits = raycaster.intersectObject(isl.terrainMeshObj, false);
        let pt = null;
        if (hits.length > 0) {
            pt = hits[0].point;
        } else {
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -(isl.oy + 8));
            const target = new THREE.Vector3();
            if (raycaster.ray.intersectPlane(plane, target)) pt = target;
        }
        if (!pt) return;

        const nx = clamp((pt.x - isl.ox) / isl.half, -0.96, 0.96);
        const nz = clamp((pt.z - isl.oz) / isl.half, -0.96, 0.96);

        if (drag.role === 'entry') {
            islCfg.entryNorm = { x: Number(nx.toFixed(3)), z: Number(nz.toFixed(3)), yOffset: islCfg.entryNorm ? (islCfg.entryNorm.yOffset || 0) : 0 };
        } else if (drag.role === 'exit') {
            islCfg.exitNorm = { x: Number(nx.toFixed(3)), z: Number(nz.toFixed(3)), yOffset: islCfg.exitNorm ? (islCfg.exitNorm.yOffset || 0) : 0 };
        } else if (drag.role === 'waypoint' && islCfg.waypointsNorm && islCfg.waypointsNorm[drag.wpIdx]) {
            const prevY = islCfg.waypointsNorm[drag.wpIdx].yOffset || 0;
            islCfg.waypointsNorm[drag.wpIdx] = { x: Number(nx.toFixed(3)), z: Number(nz.toFixed(3)), yOffset: prevY };
        } else if (drag.role === 'branchStart' && islCfg.branches && islCfg.branches[drag.wpIdx]) {
            const prevY = islCfg.branches[drag.wpIdx].startNorm ? (islCfg.branches[drag.wpIdx].startNorm.yOffset || 0) : 0;
            islCfg.branches[drag.wpIdx].startNorm = { x: Number(nx.toFixed(3)), z: Number(nz.toFixed(3)), yOffset: prevY };
        } else if (drag.role === 'branchPoint' && typeof drag.wpIdx === 'string') {
            const [bIdxStr, ptIdxStr] = drag.wpIdx.split('_');
            const bIdx = parseInt(bIdxStr, 10), ptIdx = parseInt(ptIdxStr, 10);
            if (islCfg.branches && islCfg.branches[bIdx] && islCfg.branches[bIdx].pointsNorm && islCfg.branches[bIdx].pointsNorm[ptIdx]) {
                const prevY = islCfg.branches[bIdx].pointsNorm[ptIdx].yOffset || 0;
                islCfg.branches[bIdx].pointsNorm[ptIdx] = { x: Number(nx.toFixed(3)), z: Number(nz.toFixed(3)), yOffset: prevY };
            }
        }
        rebuildScene();
    }

    function handleAddWaypointOnDoubleClick(e) {
        if (!builtArchipelago) return;
        raycaster.setFromCamera(getNdcMouse(e), camera);
        const terrainMeshes = builtArchipelago.builtIslands.map(isl => isl.terrainMeshObj).filter(Boolean);
        const hits = raycaster.intersectObjects(terrainMeshes, false);
        if (hits.length === 0) return;

        const hitIslIdx = hits[0].object.userData.islandIdx;
        state.selectedIslandIdx = hitIslIdx;
        const isl = builtArchipelago.builtIslands[hitIslIdx];
        const islCfg = state.islands[hitIslIdx];
        const pt = hits[0].point;
        const nx = clamp((pt.x - isl.ox) / isl.half, -0.85, 0.85);
        const nz = clamp((pt.z - isl.oz) / isl.half, -0.85, 0.85);

        if (!Array.isArray(islCfg.waypointsNorm)) islCfg.waypointsNorm = [];
        islCfg.waypointsNorm.push({ x: Number(nx.toFixed(3)), z: Number(nz.toFixed(3)), yOffset: 0.0 });
        syncInspectorUI();
        rebuildScene();
        showToast(`${isl.name} に新しい道の経由点（黄球）を追加しました`);
    }

    function rebuildScene() {
        while (worldGroup.children.length > 0) {
            const ch = worldGroup.children.pop();
            if (ch.geometry) ch.geometry.dispose();
        }

        builtArchipelago = buildArchipelagoStage();

        const terrainMat = new THREE.MeshLambertMaterial({
            vertexColors: true,
            flatShading: true,
            wireframe: showFlags.wire
        });
        const waterMat = new THREE.MeshLambertMaterial({
            vertexColors: true,
            flatShading: true,
            transparent: true,
            opacity: 0.88,
            wireframe: showFlags.wire
        });

        let totalVerts = 0, totalTris = 0, totalTrees = 0, totalGrass = 0;

        builtArchipelago.builtIslands.forEach((isl, idx) => {
            const visibleIsl = !routeEditState.soloIsland || idx === state.selectedIslandIdx;
            const tGeo = isl.terrainMb.toThreeGeometry();
            const tMesh = new THREE.Mesh(tGeo, terrainMat);
            tMesh.castShadow = true;
            tMesh.receiveShadow = true;
            tMesh.visible = visibleIsl;
            tMesh.userData = { islandIdx: idx };
            worldGroup.add(tMesh);
            isl.terrainMeshObj = tMesh;

            totalVerts += isl.terrainMb.v.length / 3;
            totalTris += isl.terrainMb.v.length / 9;

            if (isl.waterMb.v.length > 0) {
                const wGeo = isl.waterMb.toThreeGeometry();
                const wMesh = new THREE.Mesh(wGeo, waterMat);
                wMesh.visible = showFlags.water && visibleIsl;
                wMesh.userData = { tag: 'water', islandIdx: idx };
                worldGroup.add(wMesh);
                totalVerts += isl.waterMb.v.length / 3;
                totalTris += isl.waterMb.v.length / 9;
            }

            if (isl.vegMb.v.length > 0) {
                const vGeo = isl.vegMb.toThreeGeometry();
                const vMesh = new THREE.Mesh(vGeo, terrainMat);
                vMesh.castShadow = true;
                vMesh.receiveShadow = true;
                vMesh.visible = showFlags.veg && visibleIsl;
                vMesh.userData = { tag: 'veg', islandIdx: idx };
                worldGroup.add(vMesh);
                totalVerts += isl.vegMb.v.length / 3;
                totalTris += isl.vegMb.v.length / 9;
            }

            totalTrees += isl.treeCount;
            totalGrass += isl.grassClumpCount;
        });

        if (builtArchipelago.allBridgeMb.v.length > 0) {
            const bGeo = builtArchipelago.allBridgeMb.toThreeGeometry();
            const bMesh = new THREE.Mesh(bGeo, terrainMat);
            bMesh.castShadow = true;
            bMesh.receiveShadow = true;
            worldGroup.add(bMesh);
            totalVerts += builtArchipelago.allBridgeMb.v.length / 3;
            totalTris += builtArchipelago.allBridgeMb.v.length / 9;
        }

        const gizmo = createGizmoGroup(builtArchipelago);
        gizmo.visible = routeEditState.enabled;
        gizmo.userData = { tag: 'route' };
        worldGroup.add(gizmo);

        // Status Bar 更新
        const selIsl = builtArchipelago.builtIslands[state.selectedIslandIdx] || builtArchipelago.builtIslands[0];
        document.getElementById('hudIslandCount').textContent = `${builtArchipelago.builtIslands.length}島/${builtArchipelago.builtBridges.length}橋`;
        document.getElementById('hudVerts').textContent = totalVerts.toLocaleString();
        document.getElementById('hudTris').textContent = totalTris.toLocaleString();
        document.getElementById('hudVegInfo').textContent = `${totalTrees}本/${totalGrass}株`;
        document.getElementById('lblMeshActual').textContent = `${selIsl.resolution}分割`;

        updateCamera();
    }

    // =========================================================================
    // 8. Unity Prefab (.prefab) / JSON / PLY 出力
    // =========================================================================
    function floatToHexLE(val) {
        const buf = new ArrayBuffer(4);
        new DataView(buf).setFloat32(0, val, true);
        const bytes = new Uint8Array(buf);
        return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    function uint32ToHexLE(val) {
        const buf = new ArrayBuffer(4);
        new DataView(buf).setUint32(0, val >>> 0, true);
        const bytes = new Uint8Array(buf);
        return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function serializeMeshToUnityYaml(fileId, meshName, mb) {
        const geo = mb.toThreeGeometry();
        const pos = geo.getAttribute('position');
        const nrm = geo.getAttribute('normal');
        const col = geo.getAttribute('color');
        const vCount = pos.count;

        let vHex = '', iHex = '';
        let minX = 1e9, minY = 1e9, minZ = 1e9;
        let maxX = -1e9, maxY = -1e9, maxZ = -1e9;

        for (let i = 0; i < vCount; i++) {
            const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
            const nx = nrm.getX(i), ny = nrm.getY(i), nz = nrm.getZ(i);
            const r = clamp(Math.round(col.getX(i) * 255), 0, 255);
            const g = clamp(Math.round(col.getY(i) * 255), 0, 255);
            const b = clamp(Math.round(col.getZ(i) * 255), 0, 255);
            const a = clamp(Math.round((mb.a[i] !== undefined ? mb.a[i] : 1) * 255), 0, 255);

            if (x < minX) minX = x; if (x > maxX) maxX = x;
            if (y < minY) minY = y; if (y > maxY) maxY = y;
            if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;

            vHex += floatToHexLE(x) + floatToHexLE(y) + floatToHexLE(z);
            vHex += floatToHexLE(nx) + floatToHexLE(ny) + floatToHexLE(nz);
            vHex += r.toString(16).padStart(2, '0') + g.toString(16).padStart(2, '0') + b.toString(16).padStart(2, '0') + a.toString(16).padStart(2, '0');
            iHex += uint32ToHexLE(i);
        }
        geo.dispose();

        const cx = ((minX + maxX) * 0.5).toFixed(3), cy = ((minY + maxY) * 0.5).toFixed(3), cz = ((minZ + maxZ) * 0.5).toFixed(3);
        const ex = Math.max(0.5, (maxX - minX) * 0.5).toFixed(3), ey = Math.max(0.5, (maxY - minY) * 0.5).toFixed(3), ez = Math.max(0.5, (maxZ - minZ) * 0.5).toFixed(3);

        return `--- !u!43 &${fileId}
Mesh:
  m_ObjectHideFlags: 0
  m_Name: ${meshName}
  serializedVersion: 10
  m_SubMeshes:
  - serializedVersion: 2
    firstByte: 0
    indexCount: ${vCount}
    topology: 0
    baseVertex: 0
    firstVertex: 0
    vertexCount: ${vCount}
    localAABB:
      m_Center: {x: ${cx}, y: ${cy}, z: ${cz}}
      m_Extent: {x: ${ex}, y: ${ey}, z: ${ez}}
  m_IndexFormat: 1
  m_IndexBuffer: ${iHex}
  m_VertexData:
    serializedVersion: 3
    m_VertexCount: ${vCount}
    m_Channels:
    - stream: 0
      offset: 0
      format: 0
      dimension: 3
    - stream: 0
      offset: 12
      format: 0
      dimension: 3
    - stream: 0
      offset: 24
      format: 2
      dimension: 4
    m_DataSize: ${vCount * 28}
    _typelessdata: ${vHex}
  m_LocalAABB:
    m_Center: {x: ${cx}, y: ${cy}, z: ${cz}}
    m_Extent: {x: ${ex}, y: ${ey}, z: ${ez}}
`;
    }

    function exportUnityPrefab() {
        if (!builtArchipelago) return;
        const combTerrain = new ColoredMeshBuilder();
        const combWater = new ColoredMeshBuilder();
        builtArchipelago.builtIslands.forEach(isl => {
            for (let i = 0; i < isl.terrainMb.v.length; i++) {
                combTerrain.v.push(isl.terrainMb.v[i]);
                combTerrain.c.push(isl.terrainMb.c[i]);
                combTerrain.a.push(isl.terrainMb.a[i]);
            }
            for (let i = 0; i < isl.vegMb.v.length; i++) {
                combTerrain.v.push(isl.vegMb.v[i]);
                combTerrain.c.push(isl.vegMb.c[i]);
                combTerrain.a.push(isl.vegMb.a[i]);
            }
            for (let i = 0; i < isl.waterMb.v.length; i++) {
                combWater.v.push(isl.waterMb.v[i]);
                combWater.c.push(isl.waterMb.c[i]);
                combWater.a.push(isl.waterMb.a[i]);
            }
        });
        for (let i = 0; i < builtArchipelago.allBridgeMb.v.length; i++) {
            combTerrain.v.push(builtArchipelago.allBridgeMb.v[i]);
            combTerrain.c.push(builtArchipelago.allBridgeMb.c[i]);
            combTerrain.a.push(builtArchipelago.allBridgeMb.a[i]);
        }

        const yaml = `%YAML 1.1
%TAG !u! tag:unity3d.com,2011:
--- !u!1 &100000
GameObject:
  m_ObjectHideFlags: 0
  m_Name: ${state.stageName}
  m_Component:
  - component: {fileID: 100001}
  - component: {fileID: 100002}
  - component: {fileID: 100003}
  - component: {fileID: 100004}
  m_IsActive: 1
--- !u!4 &100001
Transform:
  m_GameObject: {fileID: 100000}
  m_LocalRotation: {x: 0, y: 0, z: 0, w: 1}
  m_LocalPosition: {x: 0, y: 0, z: 0}
  m_LocalScale: {x: 1, y: 1, z: 1}
--- !u!33 &100002
MeshFilter:
  m_GameObject: {fileID: 100000}
  m_Mesh: {fileID: 4300001}
--- !u!23 &100003
MeshRenderer:
  m_GameObject: {fileID: 100000}
  m_Materials:
  - {fileID: 2100000, guid: 0e85f5f68f616314688fac45cd8b35c3, type: 2}
--- !u!64 &100004
MeshCollider:
  m_GameObject: {fileID: 100000}
  m_Mesh: {fileID: 4300001}
${serializeMeshToUnityYaml(4300001, state.stageName + "_TerrainMesh", combTerrain)}
`;
        downloadText(`${state.stageName}.prefab`, yaml);
        showToast(`${state.stageName}.prefab を出力しました`);
    }

    function exportSettingsJson() {
        downloadText(`${state.stageName}_Settings.json`, JSON.stringify(state, null, 2));
        showToast("設定JSONを保存しました");
    }

    function exportPlyMesh() {
        if (!builtArchipelago) return;
        const comb = new ColoredMeshBuilder();
        builtArchipelago.builtIslands.forEach(isl => {
            for (let i = 0; i < isl.terrainMb.v.length; i++) {
                comb.v.push(isl.terrainMb.v[i]);
                comb.c.push(isl.terrainMb.c[i]);
            }
        });
        const vCount = comb.v.length / 3;
        const tCount = vCount / 3;
        let lines = [
            "ply",
            "format ascii 1.0",
            `element vertex ${vCount}`,
            "property float x",
            "property float y",
            "property float z",
            "property uchar red",
            "property uchar green",
            "property uchar blue",
            `element face ${tCount}`,
            "property list uchar int vertex_indices",
            "end_header"
        ];
        for (let i = 0; i < vCount; i++) {
            const x = comb.v[i * 3].toFixed(3), y = comb.v[i * 3 + 1].toFixed(3), z = comb.v[i * 3 + 2].toFixed(3);
            const r = clamp(Math.round(comb.c[i * 3] * 255), 0, 255);
            const g = clamp(Math.round(comb.c[i * 3 + 1] * 255), 0, 255);
            const b = clamp(Math.round(comb.c[i * 3 + 2] * 255), 0, 255);
            lines.push(`${x} ${y} ${z} ${r} ${g} ${b}`);
        }
        for (let t = 0; t < tCount; t++) {
            const base = t * 3;
            lines.push(`3 ${base} ${base + 1} ${base + 2}`);
        }
        downloadText(`${state.stageName}_VertexColor.ply`, lines.join('\n'));
        showToast("頂点カラー付きPLYメッシュを保存しました");
    }

    function downloadText(filename, text) {
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
    }

    let toastTimer = null;
    function showToast(msg) {
        const box = document.getElementById('toastBox');
        if (!box) return;
        box.textContent = msg;
        box.classList.remove('hidden');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => box.classList.add('hidden'), 2800);
    }

    function renderIslandListUI() {
        const container = document.getElementById('islandListContainer');
        if (!container) return;
        container.innerHTML = '';
        state.islands.forEach((isl, idx) => {
            const div = document.createElement('div');
            div.className = `island-pill ${idx === state.selectedIslandIdx ? 'active' : ''}`;
            div.innerHTML = `
                <span class="truncate pr-2">${isl.label}</span>
                <div class="flex items-center gap-1 flex-shrink-0">
                    <span class="text-[10px] font-mono opacity-75">${isl.width}m / Y:</span>
                    <input type="number" step="1" min="-40" max="85" value="${isl.posY}" class="u-num !w-12 !py-0 text-[10px]" title="島の高さ（標高 Y m）">
                </div>
            `;
            const yInput = div.querySelector('input');
            yInput.addEventListener('click', e => e.stopPropagation());
            yInput.addEventListener('change', e => {
                e.stopPropagation();
                isl.posY = clamp(parseFloat(e.target.value) || 0, -40, 85);
                if (state.selectedIslandIdx === idx) syncInspectorUI();
                markDirtyOrRebuild();
            });
            div.addEventListener('click', () => {
                state.selectedIslandIdx = idx;
                syncInspectorUI();
                rebuildScene();
            });
            container.appendChild(div);
        });
    }

    function renderWaypointListUI() {
        const container = document.getElementById('waypointListContainer');
        if (!container) return;
        container.innerHTML = '';
        const isl = state.islands[state.selectedIslandIdx] || state.islands[0];
        if (!Array.isArray(isl.waypointsNorm)) isl.waypointsNorm = [];
        if (!isl.segmentTypes) isl.segmentTypes = {};

        const getMode = (segKey) => isl.segmentTypes[segKey] || 'trail';

        // 本線の指定位置 (insertIdx) に経由点を挿入し、区間タイプと分岐参照を正しくシフトする
        function insertMainWaypointAt(insertIdx) {
            const pts = [isl.entryNorm, ...isl.waypointsNorm, isl.exitNorm];
            const pA = pts[insertIdx] || { x: -0.2, z: 0.2 };
            const pB = pts[insertIdx + 1] || { x: 0.2, z: -0.2 };
            const midPt = {
                x: Number(((pA.x + pB.x) * 0.5).toFixed(3)),
                z: Number(((pA.z + pB.z) * 0.5).toFixed(3)),
                yOffset: 0.0
            };

            const oldCount = isl.waypointsNorm.length + 1;
            const newSegTypes = {};
            Object.keys(isl.segmentTypes).forEach(k => {
                if (!k.startsWith('seg_')) newSegTypes[k] = isl.segmentTypes[k];
            });
            for (let k = 0; k < oldCount; k++) {
                const m = getMode(`seg_${k}`);
                if (k < insertIdx) {
                    newSegTypes[`seg_${k}`] = m;
                } else if (k === insertIdx) {
                    newSegTypes[`seg_${k}`] = 'trail';
                    newSegTypes[`seg_${k + 1}`] = m;
                } else {
                    newSegTypes[`seg_${k + 1}`] = m;
                }
            }
            isl.segmentTypes = newSegTypes;
            isl.waypointsNorm.splice(insertIdx, 0, midPt);

            if (Array.isArray(isl.branches)) {
                isl.branches.forEach(br => {
                    ['fromRef', 'toRef'].forEach(prop => {
                        if (typeof br[prop] === 'string' && br[prop].startsWith('wp_')) {
                            const w = parseInt(br[prop].slice(3), 10);
                            if (w >= insertIdx) br[prop] = `wp_${w + 1}`;
                        }
                    });
                });
            }
            rebuildScene();
            selectAndHighlightGizmo({ islandIdx: state.selectedIslandIdx, role: 'waypoint', wpIdx: insertIdx }, true);
        }

        // 本線の経由点 (delIdx) を削除し、区間タイプと分岐参照を正しく詰める
        function deleteMainWaypointAt(delIdx) {
            const oldCount = isl.waypointsNorm.length + 1;
            const newSegTypes = {};
            Object.keys(isl.segmentTypes).forEach(k => {
                if (!k.startsWith('seg_')) newSegTypes[k] = isl.segmentTypes[k];
            });
            for (let k = 0; k < oldCount - 1; k++) {
                if (k < delIdx) {
                    newSegTypes[`seg_${k}`] = getMode(`seg_${k}`);
                } else if (k === delIdx) {
                    newSegTypes[`seg_${k}`] = 'trail';
                } else {
                    newSegTypes[`seg_${k}`] = getMode(`seg_${k + 1}`);
                }
            }
            isl.segmentTypes = newSegTypes;
            isl.waypointsNorm.splice(delIdx, 1);

            if (Array.isArray(isl.branches)) {
                isl.branches.forEach(br => {
                    ['fromRef', 'toRef'].forEach(prop => {
                        if (typeof br[prop] === 'string' && br[prop].startsWith('wp_')) {
                            const w = parseInt(br[prop].slice(3), 10);
                            if (w === delIdx) br[prop] = prop === 'fromRef' ? 'entry' : 'none';
                            else if (w > delIdx) br[prop] = `wp_${w - 1}`;
                        }
                    });
                });
            }
            routeEditState.selectedGizmo = null;
            rebuildScene();
            syncInspectorUI();
        }

        // 任意の2点間の「区間コネクタ行（道 / 橋 / トンネル / 切断 の選択 ＋ 点挿入ボタン）」を生成
        function makeSegmentRow(segKey, labelText, onInsertPoint) {
            const mode = getMode(segKey);
            const borderCls = mode === 'bridge' ? 'border-l-sky-400 bg-[#121e2b]'
                : (mode === 'tunnel' ? 'border-l-orange-400 bg-[#261a14]'
                : (mode === 'none' ? 'border-l-rose-500 bg-[#211519]'
                : 'border-l-amber-400/70 bg-[#14181f]'));
            const txtCls = mode === 'bridge' ? 'text-sky-300'
                : (mode === 'tunnel' ? 'text-orange-300'
                : (mode === 'none' ? 'text-rose-300' : 'text-[#a1a1aa]'));

            const segRow = document.createElement('div');
            segRow.setAttribute('data-gizmo-row', `seg_${segKey}`);
            segRow.className = `flex items-center justify-between px-2 py-0.5 ml-2 text-[10px] rounded border border-transparent border-l-2 gap-1 ${borderCls}`;
            segRow.innerHTML = `
                <span class="${txtCls} truncate">↓ ${labelText}</span>
                <div class="flex items-center gap-1 flex-shrink-0">
                    <select class="u-select !w-[78px] !py-0 !px-1 text-[10px]" data-seg-mode="${segKey}">
                        <option value="trail" ${mode === 'trail' ? 'selected' : ''}>道</option>
                        <option value="bridge" ${mode === 'bridge' ? 'selected' : ''}>橋</option>
                        <option value="tunnel" ${mode === 'tunnel' ? 'selected' : ''}>トンネル</option>
                        <option value="none" ${mode === 'none' ? 'selected' : ''}>切断</option>
                    </select>
                    ${onInsertPoint ? `<button class="u-btn !py-0 !px-1.5 text-[9.5px]" data-ins-pt="1" title="この区間の真ん中に新しい点を挿入">＋点</button>` : ''}
                </div>
            `;
            segRow.addEventListener('click', e => {
                if (e.target.tagName === 'SELECT' || e.target.tagName === 'BUTTON') return;
                selectAndHighlightGizmo({ islandIdx: state.selectedIslandIdx, role: 'segment', wpIdx: -1, segKey }, false);
                rebuildScene();
            });
            segRow.querySelector('[data-seg-mode]').addEventListener('change', e => {
                isl.segmentTypes[segKey] = e.target.value;
                rebuildScene();
                selectAndHighlightGizmo({ islandIdx: state.selectedIslandIdx, role: 'segment', wpIdx: -1, segKey }, false);
            });
            const insBtn = segRow.querySelector('[data-ins-pt]');
            if (insBtn && onInsertPoint) {
                insBtn.addEventListener('click', e => {
                    e.stopPropagation();
                    onInsertPoint();
                });
            }
            return segRow;
        }

        // 1. 入口行
        const enRow = document.createElement('div');
        enRow.setAttribute('data-gizmo-row', 'entry');
        enRow.className = 'flex items-center justify-between bg-[#181c22] px-2 py-1 rounded border border-[#2d3748] gap-1 cursor-pointer';
        const enYOff = isl.entryNorm && isl.entryNorm.yOffset ? isl.entryNorm.yOffset : 0;
        enRow.innerHTML = `
            <span class="text-emerald-400 font-semibold truncate">入口 / 橋受け口 (緑球)</span>
            <div class="flex items-center gap-1 flex-shrink-0">
                <span class="text-[10px] text-[#9ca3af]">高さY:</span>
                <input type="number" step="0.5" min="-18" max="35" value="${enYOff}" class="u-num !w-14 !px-1 !py-0 text-[10px]" data-yoff="entry">
            </div>
        `;
        enRow.addEventListener('click', () => {
            selectAndHighlightGizmo({ islandIdx: state.selectedIslandIdx, role: 'entry', wpIdx: -1 }, false);
            rebuildScene();
        });
        enRow.querySelector('[data-yoff="entry"]').addEventListener('click', e => e.stopPropagation());
        enRow.querySelector('[data-yoff="entry"]').addEventListener('change', e => {
            if (!isl.entryNorm) isl.entryNorm = { x: -0.4, z: 0.4, yOffset: 0 };
            isl.entryNorm.yOffset = clamp(parseFloat(e.target.value) || 0, -18, 35);
            markDirtyOrRebuild();
        });
        container.appendChild(enRow);

        // 2. 本線の各区間と経由点（橋やトンネルの端点も順序どおりに真ん中へ表示）
        const totalLinks = isl.waypointsNorm.length + 1;
        for (let i = 0; i < totalLinks; i++) {
            const segKey = `seg_${i}`;
            const segLabel = i === 0
                ? (isl.waypointsNorm.length > 0 ? '入口 → 点#1' : '入口 → 出口')
                : (i === isl.waypointsNorm.length ? `点#${i} → 出口` : `点#${i} → 点#${i + 1}`);
            container.appendChild(makeSegmentRow(segKey, segLabel, () => insertMainWaypointAt(i)));

            if (i < isl.waypointsNorm.length) {
                const wp = isl.waypointsNorm[i];
                const prevMode = getMode(`seg_${i}`);
                const nextMode = getMode(`seg_${i + 1}`);
                let roleLabel = '黄球';
                let roleTextCls = 'text-amber-300';
                if (nextMode === 'bridge') { roleLabel = '橋始・水色球'; roleTextCls = 'text-sky-300 font-semibold'; }
                else if (prevMode === 'bridge') { roleLabel = '橋終・青球'; roleTextCls = 'text-blue-300 font-semibold'; }
                else if (nextMode === 'tunnel') { roleLabel = '坑口・橙球'; roleTextCls = 'text-orange-300 font-semibold'; }
                else if (prevMode === 'tunnel') { roleLabel = '坑終・赤球'; roleTextCls = 'text-rose-300 font-semibold'; }

                const row = document.createElement('div');
                row.setAttribute('data-gizmo-row', `waypoint_${i}`);
                row.className = 'flex items-center justify-between bg-[#181c22] px-2 py-1 rounded border border-[#2d3748] gap-1 cursor-pointer';
                row.innerHTML = `
                    <span class="${roleTextCls} truncate">点 #${i + 1} (${roleLabel})</span>
                    <div class="flex items-center gap-1 flex-shrink-0">
                        <span class="text-[9.5px] text-[#9ca3af]">Y:</span>
                        <input type="number" step="0.5" min="-18" max="35" value="${wp.yOffset || 0}" class="u-num !w-14 !px-1 !py-0 text-[10px]" data-wp-y="${i}" title="高さオフセット Y (m)">
                        <button class="u-btn !py-0 !px-1.5 text-[10px] text-rose-300" data-del-wp="${i}" title="削除">×</button>
                    </div>
                `;
                row.addEventListener('click', () => {
                    selectAndHighlightGizmo({ islandIdx: state.selectedIslandIdx, role: 'waypoint', wpIdx: i }, false);
                    rebuildScene();
                });
                row.querySelector(`[data-wp-y="${i}"]`).addEventListener('click', e => e.stopPropagation());
                row.querySelector(`[data-wp-y="${i}"]`).addEventListener('change', e => {
                    wp.yOffset = clamp(parseFloat(e.target.value) || 0, -18, 35);
                    markDirtyOrRebuild();
                });
                row.querySelector('[data-del-wp]').addEventListener('click', e => {
                    e.stopPropagation();
                    deleteMainWaypointAt(i);
                });
                container.appendChild(row);
            }
        }

        // 3. 出口行
        const exRow = document.createElement('div');
        exRow.setAttribute('data-gizmo-row', 'exit');
        exRow.className = 'flex items-center justify-between bg-[#181c22] px-2 py-1 rounded border border-[#2d3748] gap-1 cursor-pointer';
        const exYOff = isl.exitNorm && isl.exitNorm.yOffset ? isl.exitNorm.yOffset : 0;
        exRow.innerHTML = `
            <span class="text-purple-400 font-semibold truncate">出口 / 橋出し口 (紫球)</span>
            <div class="flex items-center gap-1 flex-shrink-0">
                <span class="text-[10px] text-[#9ca3af]">高さY:</span>
                <input type="number" step="0.5" min="-18" max="35" value="${exYOff}" class="u-num !w-14 !px-1 !py-0 text-[10px]" data-yoff="exit">
            </div>
        `;
        exRow.addEventListener('click', () => {
            selectAndHighlightGizmo({ islandIdx: state.selectedIslandIdx, role: 'exit', wpIdx: -1 }, false);
            rebuildScene();
        });
        exRow.querySelector('[data-yoff="exit"]').addEventListener('click', e => e.stopPropagation());
        exRow.querySelector('[data-yoff="exit"]').addEventListener('change', e => {
            if (!isl.exitNorm) isl.exitNorm = { x: 0.4, z: -0.4, yOffset: 0 };
            isl.exitNorm.yOffset = clamp(parseFloat(e.target.value) || 0, -18, 35);
            markDirtyOrRebuild();
        });
        container.appendChild(exRow);

        // 4. 分岐道 (`isl.branches`) の一覧（各分岐区間も 道 / 橋 / トンネル / 切断 を個別指定可能）
        if (Array.isArray(isl.branches) && isl.branches.length > 0) {
            const brPathHeader = document.createElement('div');
            brPathHeader.className = 'text-[10px] text-pink-300 font-semibold mt-1.5 pt-1 border-t border-[#2d3748]';
            brPathHeader.textContent = '分岐道（各区間を 道 / 橋 / トンネル に設定可能）:';
            container.appendChild(brPathHeader);

            const buildNodeOptions = (selectedVal, includeNone, selfBrIdx) => {
                let html = '';
                if (includeNone) {
                    html += `<option value="none" ${selectedVal === 'none' ? 'selected' : ''}>行き止まり(脇道)</option>`;
                }
                html += `<option value="entry" ${selectedVal === 'entry' ? 'selected' : ''}>入口</option>`;
                for (let w = 0; w < isl.waypointsNorm.length; w++) {
                    const key = `wp_${w}`;
                    html += `<option value="${key}" ${selectedVal === key ? 'selected' : ''}>点 #${w + 1}</option>`;
                }
                html += `<option value="exit" ${selectedVal === 'exit' ? 'selected' : ''}>出口</option>`;
                for (let ob = 0; ob < isl.branches.length; ob++) {
                    if (ob === selfBrIdx) continue;
                    const key = `br_${ob}_last`;
                    html += `<option value="${key}" ${selectedVal === key ? 'selected' : ''}>分岐#${ob + 1}の終点</option>`;
                }
                if (!includeNone) {
                    html += `<option value="custom" ${selectedVal === 'custom' ? 'selected' : ''}>自由起点(球)</option>`;
                }
                return html;
            };

            isl.branches.forEach((br, bIdx) => {
                if (!Array.isArray(br.pointsNorm) || br.pointsNorm.length === 0) {
                    br.pointsNorm = [br.endNorm ? { x: br.endNorm.x, z: br.endNorm.z, yOffset: 0 } : { x: 0.2, z: 0.3, yOffset: 0 }];
                }

                function insertBranchPointAt(segIdx) {
                    const prevPt = segIdx === 0
                        ? (br.startNorm || { x: 0, z: 0 })
                        : br.pointsNorm[segIdx - 1];
                    const nextPt = br.pointsNorm[segIdx];
                    const midPt = {
                        x: Number(((prevPt.x + nextPt.x) * 0.5).toFixed(3)),
                        z: Number(((prevPt.z + nextPt.z) * 0.5).toFixed(3)),
                        yOffset: 0.0
                    };
                    const oldLen = br.pointsNorm.length;
                    const newModes = {};
                    for (let k = 0; k < oldLen; k++) {
                        const m = getMode(`branch_${bIdx}_${k}`);
                        if (k < segIdx) newModes[k] = m;
                        else if (k === segIdx) { newModes[k] = 'trail'; newModes[k + 1] = m; }
                        else newModes[k + 1] = m;
                    }
                    Object.keys(newModes).forEach(k => {
                        isl.segmentTypes[`branch_${bIdx}_${k}`] = newModes[k];
                    });
                    br.pointsNorm.splice(segIdx, 0, midPt);
                    rebuildScene();
                    selectAndHighlightGizmo({ islandIdx: state.selectedIslandIdx, role: 'branchPoint', wpIdx: `${bIdx}_${segIdx}` }, true);
                }

                function deleteBranchPointAt(ptIdx) {
                    const oldLen = br.pointsNorm.length;
                    const newModes = {};
                    for (let k = 0; k < oldLen - 1; k++) {
                        if (k < ptIdx) newModes[k] = getMode(`branch_${bIdx}_${k}`);
                        else if (k === ptIdx) newModes[k] = 'trail';
                        else newModes[k] = getMode(`branch_${bIdx}_${k + 1}`);
                    }
                    delete isl.segmentTypes[`branch_${bIdx}_${oldLen - 1}`];
                    Object.keys(newModes).forEach(k => {
                        isl.segmentTypes[`branch_${bIdx}_${k}`] = newModes[k];
                    });
                    br.pointsNorm.splice(ptIdx, 1);
                    rebuildScene();
                    syncInspectorUI();
                }

                const bBox = document.createElement('div');
                bBox.setAttribute('data-gizmo-row', `branch_${bIdx}`);
                bBox.className = 'flex flex-col bg-[#241623] p-1.5 rounded border border-[#5e2750] gap-1';
                bBox.innerHTML = `
                    <div class="flex items-center justify-between gap-1 flex-wrap">
                        <span class="text-pink-300 text-[10px] font-semibold">分岐 #${bIdx + 1} (${br.pointsNorm.length}点)</span>
                        <div class="flex items-center gap-1">
                            <button class="u-btn u-btn-primary !py-0 !px-1.5 text-[10px]" data-ext-br="${bIdx}" title="この分岐道の先に続きのポイントを追加">＋ 続き</button>
                            <button class="u-btn !py-0 !px-1.5 text-[10px] text-rose-300" data-del-br="${bIdx}" title="分岐道を削除">×</button>
                        </div>
                    </div>
                    <div class="flex items-center justify-between gap-1 text-[10px]">
                        <span class="text-pink-200">元:</span>
                        <select class="u-select !w-24 !py-0 text-[10px]" data-br-from="${bIdx}">
                            ${buildNodeOptions(br.fromRef || 'entry', false, bIdx)}
                        </select>
                        <span class="text-pink-200">先:</span>
                        <select class="u-select !w-28 !py-0 text-[10px]" data-br-to="${bIdx}">
                            ${buildNodeOptions(br.toRef || 'none', true, bIdx)}
                        </select>
                    </div>
                    <div class="flex flex-col gap-1 pt-0.5 border-t border-[#3d1d36]" data-br-pts="${bIdx}"></div>
                `;

                const ptsContainer = bBox.querySelector(`[data-br-pts="${bIdx}"]`);
                br.pointsNorm.forEach((pt, ptIdx) => {
                    const segKey = `branch_${bIdx}_${ptIdx}`;
                    const segLabel = ptIdx === 0 ? '元 → 点1' : `点${ptIdx} → 点${ptIdx + 1}`;
                    ptsContainer.appendChild(makeSegmentRow(segKey, segLabel, () => insertBranchPointAt(ptIdx)));

                    const prevMode = getMode(segKey);
                    const nextKey = (ptIdx + 1 < br.pointsNorm.length) ? `branch_${bIdx}_${ptIdx + 1}` : (br.toRef && br.toRef !== 'none' ? `branch_${bIdx}_merge` : null);
                    const nextMode = nextKey ? getMode(nextKey) : 'none';
                    let brRoleText = 'ピンク球';
                    let brRoleCls = 'text-pink-200/90';
                    if (nextMode === 'bridge') { brRoleText = '橋始・水色'; brRoleCls = 'text-sky-300 font-semibold'; }
                    else if (prevMode === 'bridge') { brRoleText = '橋終・青'; brRoleCls = 'text-blue-300 font-semibold'; }
                    else if (nextMode === 'tunnel') { brRoleText = '坑口・橙'; brRoleCls = 'text-orange-300 font-semibold'; }
                    else if (prevMode === 'tunnel') { brRoleText = '坑終・赤'; brRoleCls = 'text-rose-300 font-semibold'; }

                    const ptRow = document.createElement('div');
                    ptRow.setAttribute('data-gizmo-sub', `branchPt_${bIdx}_${ptIdx}`);
                    ptRow.className = 'flex items-center justify-between text-[10px] bg-[#1a111a] px-1.5 py-0.5 rounded border border-[#4a2240] gap-1 cursor-pointer';
                    ptRow.innerHTML = `
                        <span class="${brRoleCls} truncate">点${ptIdx + 1} (${brRoleText})</span>
                        <div class="flex items-center gap-1 flex-shrink-0">
                            <span class="text-[9.5px] text-[#9ca3af]">Y:</span>
                            <input type="number" step="0.5" min="-18" max="35" value="${pt.yOffset || 0}" class="u-num !w-14 !px-1 !py-0 text-[10px]" data-brpt-y="${ptIdx}">
                            ${br.pointsNorm.length > 1 ? `<button class="u-btn !py-0 !px-1 text-[9.5px] text-rose-300" data-del-brpt="${ptIdx}">×</button>` : ''}
                        </div>
                    `;
                    ptRow.addEventListener('click', () => {
