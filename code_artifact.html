<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>群島・ステージ連結型 ローポリ浮島＆橋ジェネレーター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --u-bg-dark: #18181b;
            --u-panel: #232326;
            --u-header: #2d2d32;
            --u-input: #141417;
            --u-border: #111113;
            --u-accent: #3b82f6;
            --u-text: #d4d4d8;
        }
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--u-bg-dark);
            color: var(--u-text);
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            font-size: 12px;
            overflow: hidden;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1c1c1f; }
        ::-webkit-scrollbar-thumb { background: #46464e; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #5a5a64; }

        .u-row {
            display: flex;
            align-items: center;
            min-height: 24px;
            margin-bottom: 4px;
            gap: 8px;
        }
        .u-label {
            width: 44%;
            flex-shrink: 0;
            color: #c4c4cc;
            font-size: 11.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .u-control {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }
        .u-slider {
            -webkit-appearance: none;
            appearance: none;
            flex: 1;
            min-width: 0;
            height: 4px;
            background: #141417;
            border: 1px solid #3c3c44;
            border-radius: 2px;
            outline: none;
        }
        .u-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 14px;
            background: #a1a1aa;
            border: 1px solid #111;
            border-radius: 2px;
            cursor: pointer;
        }
        .u-slider::-webkit-slider-thumb:hover { background: #e4e4e7; }

        .u-num, .u-text, .u-select {
            background: var(--u-input);
            border: 1px solid #3f3f46;
            color: #ececef;
            border-radius: 3px;
            padding: 2px 6px;
            font-size: 11.5px;
            outline: none;
            transition: border-color 0.12s;
        }
        .u-num { width: 54px; flex-shrink: 0; text-align: right; font-variant-numeric: tabular-nums; }
        .u-text, .u-select { width: 100%; min-width: 0; }
        .u-num:focus, .u-text:focus, .u-select:focus {
            border-color: #60a5fa;
            background: #181c24;
        }
        .u-color {
            -webkit-appearance: none;
            appearance: none;
            flex: 1;
            min-width: 0;
            height: 22px;
            border: 1px solid #3f3f46;
            border-radius: 3px;
            background: transparent;
            padding: 0;
            cursor: pointer;
        }
        .u-color::-webkit-color-swatch-wrapper { padding: 1px; }
        .u-color::-webkit-color-swatch { border: none; border-radius: 2px; }

        .u-btn {
            background: #34343a;
            border: 1px solid #1c1c20;
            border-top-color: #484852;
            color: #e4e4e7;
            border-radius: 3px;
            padding: 4px 10px;
            font-size: 11.5px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            transition: background 0.12s, filter 0.12s;
        }
        .u-btn:hover { background: #3f3f46; }
        .u-btn:active { background: #27272a; transform: translateY(0.5px); }
        .u-btn-primary {
            background: #2563eb;
            border-color: #1d4ed8;
            border-top-color: #60a5fa;
            color: #ffffff;
            font-weight: 600;
        }
        .u-btn-primary:hover { background: #3b82f6; }
        .u-btn-emerald {
            background: #059669;
            border-color: #047857;
            border-top-color: #34d399;
            color: #ffffff;
            font-weight: 600;
        }
        .u-btn-emerald:hover { background: #10b981; }

        .u-foldout {
            cursor: pointer;
            font-weight: 600;
            padding: 6px 8px;
            margin-top: 6px;
            border: 1px solid #323238;
            background: #2b2b30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            color: #e4e4e7;
            font-size: 11.5px;
            border-radius: 4px;
            transition: background 0.12s;
        }
        .u-foldout:hover { background: #323238; color: #ffffff; }
        .u-foldout-body {
            padding: 6px 4px 2px 4px;
        }
        .u-sub-header {
            font-size: 10.5px;
            font-weight: 600;
            color: #a1a1aa;
            margin: 6px 0 3px 0;
            padding-bottom: 2px;
            border-bottom: 1px solid #323238;
        }
        .u-gizmo-highlight {
            border-color: #f59e0b !important;
            background: rgba(245, 158, 11, 0.16) !important;
            box-shadow: 0 0 0 1px rgba(251, 191, 36, 0.5), inset 3px 0 0 #f59e0b;
        }
        .u-section-highlight {
            border: 1px solid #f59e0b !important;
            background: rgba(245, 158, 11, 0.08) !important;
            border-radius: 4px;
            padding: 5px 6px !important;
            margin: 4px 0;
        }

        .u-toolbar-btn {
            background: #2b2b31;
            border: 1px solid #3f3f48;
            color: #a1a1aa;
            padding: 3px 9px;
            font-size: 11px;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.12s, color 0.12s, border-color 0.12s;
        }
        .u-toolbar-btn:hover {
            background: #383842;
            color: #f4f4f5;
            border-color: #52525e;
        }
        .u-toolbar-btn.active {
            background: #2563eb;
            color: #ffffff;
            border-color: #60a5fa;
            font-weight: 600;
            box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.35);
        }
        .u-toolbar-btn.active:hover {
            background: #3b82f6;
        }
        .island-pill {
            background: #1c1c20;
            border: 1px solid #34343c;
            color: #c4c4cc;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.12s;
        }
        .island-pill:hover { background: #27272d; }
        .island-pill.active {
            background: #1e293b;
            border-color: #3b82f6;
            color: #ffffff;
            font-weight: 600;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col md:flex-row overflow-hidden">

    <!-- Left/Main 3D Scene View Area -->
    <div class="relative flex-1 flex flex-col h-[52vh] md:h-full bg-[#14161b] overflow-hidden">
        <!-- Top Scene Toolbar -->
        <div class="h-9 bg-[#232328] border-b border-[#111113] px-3 flex items-center justify-between gap-2 z-10">
            <div class="flex items-center gap-1.5">
                <button id="btnViewOrbit" class="u-toolbar-btn" title="群島全体が収まるカメラ位置へリセット">全体表示</button>
                <button id="btnFocusIsland" class="u-toolbar-btn" title="選択中の島にカメラをフォーカス">選択島にフォーカス</button>
            </div>
            <div class="flex items-center gap-1.5">
                <button id="btnToggleGizmos" class="u-toolbar-btn active" title="橋・トンネル・道の調整ハンドルの表示切替">ギズモ</button>
                <button id="btnSoloIsland" class="u-toolbar-btn" title="選択中の島のみを単独表示">選択島のみ</button>
                <span class="text-[#3f3f46] mx-0.5">|</span>
                <button id="btnToggleWire" class="u-toolbar-btn">ワイヤー</button>
                <button id="btnToggleWater" class="u-toolbar-btn active">水</button>
                <button id="btnToggleVeg" class="u-toolbar-btn active">植生</button>
            </div>
        </div>

        <!-- 3D Viewport Container -->
        <div id="viewportContainer" class="relative flex-1 w-full h-full">
            <canvas id="sceneCanvas" class="w-full h-full block cursor-grab active:cursor-grabbing"></canvas>
            <!-- Toast Notification Box -->
            <div id="toastBox" class="hidden absolute top-4 right-4 bg-[#1e293b]/95 border border-[#3b82f6] text-white px-3.5 py-2 rounded shadow-xl text-xs z-30 transition-opacity"></div>
        </div>
    </div>

    <!-- Right Docked Inspector Window -->
    <aside class="w-full md:w-[410px] lg:w-[435px] h-[48vh] md:h-full bg-[#232326] border-t md:border-t-0 md:border-l border-[#111113] flex flex-col z-20">
        <!-- Inspector Header -->
        <div class="h-9 bg-[#2d2d32] border-b border-[#141417] px-3 flex items-center justify-between flex-shrink-0">
            <span class="font-semibold text-[12px] text-[#f4f4f5]">浮島・群島ステージジェネレーター</span>
            <button id="btnResetAll" class="u-btn text-[11px] py-0.5 px-2">初期設定に戻す</button>
        </div>

        <!-- Generation Mode & Update Bar -->
        <div class="bg-[#1c1c20] border-b border-[#141417] px-3 py-2 flex items-center justify-between gap-2 flex-shrink-0">
            <div class="flex items-center bg-[#121215] p-0.5 rounded border border-[#34343c]">
                <button id="btnModeRealtime" class="px-2.5 py-1 text-[11px] rounded bg-[#2563eb] text-white font-medium">リアルタイム</button>
                <button id="btnModeManual" class="px-2.5 py-1 text-[11px] rounded text-[#a1a1aa] hover:text-white">生成ボタン</button>
            </div>
            <button id="btnGenerateNow" class="u-btn u-btn-primary flex-1 py-1 text-[11.5px] flex items-center justify-center gap-1.5">
                <span>生成 / 更新</span>
                <span id="badgePendingChanges" class="hidden px-1.5 py-0.2 bg-amber-400 text-black rounded text-[10px] font-bold">未反映</span>
            </button>
        </div>

        <!-- Compact Status Bar -->
        <div class="bg-[#18181c] border-b border-[#2b2b30] px-3 py-1.5 flex items-center justify-between text-[11px] text-[#a1a1aa] flex-shrink-0">
            <div class="flex items-center gap-2">
                <span>構成: <strong id="hudIslandCount" class="text-white font-mono">3島/3橋</strong></span>
                <span>頂点: <strong id="hudVerts" class="text-white font-mono">0</strong></span>
                <span>三角: <strong id="hudTris" class="text-white font-mono">0</strong></span>
            </div>
            <div>植生: <strong id="hudVegInfo" class="text-white font-mono">0本/0株</strong></div>
        </div>

        <!-- Scrollable Inspector Content -->
        <div class="flex-1 overflow-y-auto px-3 py-2">
            <!-- Gizmo Status & Foldout Controls -->
            <div class="flex items-center justify-between mb-1.5 gap-2">
                <span id="selectedGizmoBanner" class="text-[11px] text-amber-300/90 font-medium truncate">3D画面の球をクリックで該当設定を強調</span>
                <div class="flex items-center gap-1 flex-shrink-0">
                    <button id="btnExpandAllFolds" class="u-btn !py-0.5 !px-2 text-[10px]">全展開</button>
                    <button id="btnCollapseAllFolds" class="u-btn !py-0.5 !px-2 text-[10px]">全収納</button>
                </div>
            </div>

            <!-- 1. Archipelago & Island List -->
            <div class="u-foldout" data-fold-target="panelIslandList">
                <span>1. 群島構成・島リスト</span>
                <span class="fold-arrow text-[10px]">▼</span>
            </div>
            <div id="panelIslandList" class="u-foldout-body">
                <div class="u-row">
                    <label class="u-label">ステージ構成</label>
                    <div class="u-control">
                        <select id="selArchPreset" class="u-select">
                            <option value="canyon_pass_3">1. 渓谷湖と山越えの3連群島</option>
                            <option value="spiral_peaks_4">2. 螺旋登頂・渡河の4連群島</option>
                            <option value="twin_falls_3">3. 二段渓谷滝と祠の3連群島</option>
                        </select>
                    </div>
                </div>
                <div class="u-row">
                    <label class="u-label">出力ルート名</label>
                    <div class="u-control">
                        <input type="text" id="inpStageName" class="u-text" value="AdventureArchipelago">
                    </div>
                </div>
                <div id="islandListContainer" class="flex flex-col gap-1 mt-1.5"></div>
            </div>

            <!-- 2. Selected Island Size & Rock Base -->
            <div class="u-foldout text-[#93c5fd]" data-fold-target="panelIslandBasic">
                <span id="selectedIslandTitle" class="truncate">2. 島の配置・サイズ・岩盤</span>
                <span class="fold-arrow text-[10px]">▼</span>
            </div>
            <div id="panelIslandBasic" class="u-foldout-body">
                <div class="u-row" data-isl-bind="posY" data-min="-40" data-max="85" data-step="1">
                    <label class="u-label font-medium text-white">島の高さ・標高 Y (m)</label>
                    <div class="u-control"><input type="range" class="u-slider"><input type="number" class="u-num"></div>
                </div>
                <div class="u-row" data-isl-bind="posX" data-min="-140" data-max="140" data-step="2">
                    <label class="u-label">位置 X (m)</label>
                    <div class="u-control"><input type="range" class="u-slider"><input type="number" class="u-num"></div>
                </div>
                <div class="u-row" data-isl-bind="posZ" data-min="-160" data-max="140" data-step="2">
                    <label class="u-label">位置 Z (m)</label>
                    <div class="u-control"><input type="range" class="u-slider"><input type="number" class="u-num"></div>
                </div>
                <div class="u-row" data-isl-bind="width" data-min="36" data-max="120" data-step="2">
                    <label class="u-label">島の直径 (m)</label>
                    <div class="u-control"><input type="range" class="u-slider"><input type="number" class="u-num"></div>
                </div>
                <div class="u-row" data-isl-bind="cellSize" data-min="1.5" data-max="3.5" data-step="0.1">
                    <label class="u-label flex items-center gap-1.5">
                        <span>メッシュサイズ (m)</span>
                        <span id="lblMeshActual" class="text-[10px] text-[#93c5fd] font-mono whitespace-nowrap flex-shrink-0">44分割</span>
                    </label>
                    <div class="u-control">
                        <input type="range" class="u-slider">
                        <input type="number" class="u-num">
                    </div>
                </div>
                <div class="u-row" data-isl-bind="bottomDepthRatio" data-min="0.08" data-max="0.35" data-step="0.01">
                    <label class="u-label">下部岩盤の厚み比</label>
                    <div class="u-control"><input type="range" class="u-slider"><input type="number" class="u-num"></div>
                </div>
                <div class="u-row" data-isl-bind="edgeSharpness" data-min="0.2" data-max="1.0" data-step="0.05">
                    <label class="u-label">端の切り立ち度</label>
                    <div class="u-control"><input type="range" class="u-slider"><input type="number" class="u-num"></div>
                </div>
                <div class="u-row" data-isl-bind="cliffCragginess" data-min="0.1" data-max="1.0" data-step="0.05">
                    <label class="u-label">崖・底面のゴツゴツ感</label>
                    <div class="u-control"><input type="range" class="u-slider"><input type="number" class="u-num"></div>
                </div>
            </div>

            <!-- 3. Route, Bridge & Cave Tunnel Editor -->
            <div class="u-foldout" data-fold-target="panelRouteBridge">
                <span>3. 道・橋・トンネル（動線編集）</span>
                <span class="fold-arrow text-[10px]">▼</span>
            </div>
            <div id="panelRouteBridge" class="u-foldout-body">
                <div class="bg-[#18181c] border border-[#32323a] rounded p-2 mb-2 text-[11px]">
                    <div class="flex flex-wrap items-center gap-x-3 gap-y-1 mb-2 pb-1.5 border-b border-[#2b2b33]">
                        <label class="flex items-center gap-1.5 cursor-pointer text-[#e4e4e7]">
                            <input type="checkbox" id="chkHasTrail" class="accent-[#3b82f6]" checked>
                            <span>島内の道</span>
                        </label>
                        <label id="lblChkInternalBridge" class="flex items-center gap-1.5 cursor-pointer text-[#e4e4e7] rounded px-1">
                            <input type="checkbox" id="chkHasInternalBridge" class="accent-[#3b82f6]" checked>
                            <span>自動渡河橋</span>
                        </label>
                        <label id="lblChkBridgeToNext" class="flex items-center gap-1.5 cursor-pointer text-[#e4e4e7] rounded px-1">
                            <input type="checkbox" id="chkBridgeToNext" class="accent-[#3b82f6]" checked>
                            <span>次の島への吊り橋</span>
                        </label>
                    </div>

                    <div class="flex items-center justify-between mb-1.5 gap-1">
                        <span class="text-[#a1a1aa] text-[10.5px]">ドラッグ移動 / Shift+ドラッグ高さY</span>
                        <div class="flex gap-1">
                            <button id="btnAddWaypoint" class="u-btn py-0.5 px-2 text-[10px]">＋ 経由点</button>
                            <button id="btnAddBranch" class="u-btn u-btn-primary py-0.5 px-2 text-[10px]">＋ 分岐道</button>
                            <button id="btnResetIslandRoute" class="u-btn py-0.5 px-2 text-[10px]">リセット</button>
                        </div>
                    </div>
                    <div id="waypointListContainer" class="flex flex-col gap-1 max-h-72 overflow-y-auto pr-0.5"></div>
                </div>

                <!-- Trail Shape -->
                <div id="trailShapeControlsBox" class="rounded">
                    <div class="u-sub-header">道の平坦化・幅</div>
                    <div class="u-row" data-isl-bind="trailGradeSmooth" data-min="0.0" data-max="0.95" data-step="0.05">
                        <label class="u-label">縦断勾配の緩和</label>
                        <div class="u-control"><input type="range" class="u-slider"><input type="number" class="u-num"></div>
                    </div>
                    <div class="u-row" data-isl-bind="trailBenchCut" data-min="0.0" data-max="1.0" data-step="0.05">
                        <label class="u-label">横傾斜フラット化 (切土)</label>
                        <div class="u-control"><input type="range" class="u-slider"><input type="number" class="u-num"></div>
                    </div>
                    <div class="u-row" data-isl-bind="ridgeFlatten" data-min="0.0" data-max="1.0" data-step="0.05">
                        <label class="u-label">尾根の平坦化 (尾根道)</label>
                        <div class="u-control"><input type="range" class="u-slider"><input type="number" class="u-num"></div>
                    </div>
                    <div class="u-row" data-isl-bind="trailWidth" data-min="0.5" data-max="2.2" data-step="0.05">
                        <label class="u-label">道の幅 (m)</label>
                        <div class="u-control"><input type="range" class="u-slider"><input type="number" class="u-num"></div>
                    </div>
                </div>

                <!-- Bridge Shape -->
                <div id="bridgeParamsBox" class="rounded">
                    <div class="u-sub-header">橋の形状（幅・たるみ・板）</div>
                    <div class="u-row" data-global-bind="bridgeWidth" data-min="1.0" data-max="3.2" data-step="0.1">
                        <label class="u-label">橋の幅 (m)</label>
                        <div class="u-control"><input type="range" class="u-slider"><input type="number" class="u-num"></div>
                    </div>
                    <div class="u-row" data-global-bind="bridgeSag" data-min="0.2" data-max="2.5" data-step="0.1">
                        <label class="u-label">橋のたるみ (m)</label>
                        <div class="u-control"><input type="range" class="u-slider"><input type="number" class="u-num"></div>
                    </div>
                    <div class="u-row" data-global-bind="bridgeIrregularity" data-min="0.0" data-max="1.0" data-step="0.05">
                        <label class="u-label">板の不揃いさ</label>
                        <div class="u-control"><input type="range" class="u-slider"><input type="number" class="u-num"></div>
                    </div>
                </div>

                <!-- Cave Shape -->
                <div id="caveSettingsBox" class="rounded">
                    <div id="caveControls">
                        <div class="u-sub-header">トンネル形状（幅・高さ・湾曲）</div>
                        <div class="u-row" data-isl-bind="caveWidth" data-min="2.0" data-max="5.5" data-step="0.2">
                            <label class="u-label">トンネル幅 (m)</label>
                            <div class="u-control"><input type="range" class="u-slider"><input type="number" class="u-num"></div>
                        </div>
                        <div class="u-row" data-isl-bind="caveHeight" data-min="2.0" data-max="5.0" data-step="0.1">
                            <label class="u-label">トンネル高さ (m)</label>
                            <div class="u-control"><input type="range" class="u-slider"><input type="number" class="u-num"></div>
                        </div>
                        <div class="u-row" data-isl-bind="caveCurve" data-min="-0.5" data-max="0.5" data-step="0.05">
                            <label class="u-label">トンネルの湾曲</label>
                            <div class="u-control"><input type="range" class="u-slider"><input type="number" class="u-num"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 4. Terrain & Hydrology -->
            <div class="u-foldout" data-fold-target="panelTerrainHydro">
                <span>4. 地形・水系（山岳・渓谷・湖・川）</span>
                <span class="fold-arrow text-[10px]">▶</span>
            </div>
            <div id="panelTerrainHydro" class="u-foldout-body hidden">
                <div class="u-sub-header">山岳・平原・渓谷</div>
                <div class="u-row" data-isl-bind="baseHeight" data-min="4" data-max="22" data-step="0.5">
                    <label class="u-label">地面の基準高 (m)</label>

    // 1. 決定論的乱数 & FBM パーリンノイズ (`FloatingTerrainBuilder.cs` 準拠)
    // =========================================================================
    class SeededRandom {
        constructor(seed) {
            this.state = (seed | 0) || 123456789;
        }
        next() {
            let x = this.state;
            x ^= x << 13;
            x ^= x >>> 17;
            x ^= x << 5;
            this.state = x;
            return ((x >>> 0) / 4294967296);
        }
        range(min, max) {
            return min + (max - min) * this.next();
        }
        signed() {
            return this.next() * 2.0 - 1.0;
        }
    }

    class PerlinNoise2D {
        constructor(seed) {
            const r0 = new SeededRandom(seed);
            this.p = new Uint8Array(512);
            const perm = new Uint8Array(256);
            for (let i = 0; i < 256; i++) perm[i] = i;
            for (let i = 255; i > 0; i--) {
                const j = Math.floor(r0.next() * (i + 1));
                const tmp = perm[i]; perm[i] = perm[j]; perm[j] = tmp;
            }
            for (let i = 0; i < 512; i++) this.p[i] = perm[i & 255];
            this.offs = [];
            for (let i = 0; i < 16; i++) {
                this.offs.push({ x: r0.next() * 1000, y: r0.next() * 1000 });
            }
        }
        fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
        lerp(t, a, b) { return a + t * (b - a); }
        grad(hash, x, y) {
            const h = hash & 7;
            const u = h < 4 ? x : y;
            const v = h < 4 ? y : x;
            return ((h & 1) ? -u : u) + ((h & 2) ? -2.0 * v : 2.0 * v);
        }
        noise(x, y) {
            const X = Math.floor(x) & 255;
            const Y = Math.floor(y) & 255;
            x -= Math.floor(x);
            y -= Math.floor(y);
            const u = this.fade(x), v = this.fade(y);
            const A = this.p[X] + Y, B = this.p[X + 1] + Y;
            const res = this.lerp(v,
                this.lerp(u, this.grad(this.p[A], x, y), this.grad(this.p[B], x - 1, y)),
                this.lerp(u, this.grad(this.p[A + 1], x, y - 1), this.grad(this.p[B + 1], x - 1, y - 1))
            );
            return Math.max(0, Math.min(1, res * 0.35 + 0.5));
        }
        fbm(x, z, salt, freq, oct) {
            const o = this.offs[salt & 15];
            let a = 1.0, sum = 0.0, norm = 0.0, f = freq;
            for (let i = 0; i < oct; i++) {
                sum += a * this.noise(x * f + o.x, z * f + o.y);
                norm += a;
                a *= 0.5;
                f *= 2.0;
            }
            return sum / norm;
        }
    }

    function smoothstep(a, b, x) {
        if (Math.abs(a - b) < 1e-6) return x >= b ? 1.0 : 0.0;
        const t = Math.max(0.0, Math.min(1.0, (x - a) / (b - a)));
        return t * t * (3.0 - 2.0 * t);
    }

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    function hexToRgb(hex) {
        const clean = hex.replace('#', '');
        const num = parseInt(clean, 16);
        return { r: ((num >> 16) & 255) / 255, g: ((num >> 8) & 255) / 255, b: (num & 255) / 255 };
    }
    function lerpColor(c1, c2, t) {
        const u = clamp(t, 0, 1);
        return { r: c1.r + (c2.r - c1.r) * u, g: c1.g + (c2.g - c1.g) * u, b: c1.b + (c2.b - c1.b) * u };
    }
    function shadeColor(c, v) {
        return {
            r: clamp(c.r * (1.0 + v), 0, 1),
            g: clamp(c.g * (1.0 + v), 0, 1),
            b: clamp(c.b * (1.0 + v), 0, 1)
        };
    }

    // =========================================================================
    // 4. フラットシェーディング頂点カラーメッシュビルダー (`FloatingTerrainBuilder.Mb` 移植)
    // =========================================================================
    class ColoredMeshBuilder {
        constructor() {
            this.v = [];
            this.c = [];
            this.a = [];
        }
        tri(p0, p1, p2, c0, c1, c2, outDir, alpha = 1.0) {
            const ux = p1.x - p0.x, uy = p1.y - p0.y, uz = p1.z - p0.z;
            const vx = p2.x - p0.x, vy = p2.y - p0.y, vz = p2.z - p0.z;
            const nx = uy * vz - uz * vy;
            const ny = uz * vx - ux * vz;
            const nz = ux * vy - uy * vx;
            if (outDir && (nx * outDir.x + ny * outDir.y + nz * outDir.z < 0)) {
                const tp = p1; p1 = p2; p2 = tp;
                const tc = c1; c1 = c2; c2 = tc;
            }
            this.emit(p0, p1, p2, c0, c1, c2, alpha);
        }
        emit(p0, p1, p2, c0, c1, c2, alpha = 1.0) {
            this.v.push(p0.x, p0.y, p0.z, p1.x, p1.y, p1.z, p2.x, p2.y, p2.z);
            this.c.push(c0.r, c0.g, c0.b, c1.r, c1.g, c1.b, c2.r, c2.g, c2.b);
            this.a.push(alpha, alpha, alpha);
        }
        quad(p0, p1, p2, p3, c0, c1, c2, c3, outDir, alpha = 1.0) {
            this.tri(p0, p1, p2, c0, c1, c2, outDir, alpha);
            this.tri(p0, p2, p3, c0, c2, c3, outDir, alpha);
        }
        toThreeGeometry() {
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(this.v, 3));
            geo.setAttribute('color', new THREE.Float32BufferAttribute(this.c, 3));
            geo.computeVertexNormals();
            return geo;
        }
    }

    // =========================================================================
    // 5. 単一浮島ジェネレーター (`FloatingTerrainBuilder.cs` 小島最適化 + 6近傍直結洞窟)
    // =========================================================================
    const EvenDX = [1, 0, -1, -1, -1, 0];
    const EvenDZ = [0, 1, 1, 0, -1, -1];
    const OddDX  = [1, 1, 0, -1, 0, 1];
    const OddDZ  = [0, 1, 1, 0, -1, -1];

    function buildSingleIsland(islCfg, prevCfg, nextCfg, palette) {
        const ZStep = 0.8660254;
        const width = clamp(islCfg.width, 36, 120);
        const targetCell = clamp(islCfg.cellSize, 1.5, 3.5);
        const resolution = clamp(Math.round(width / targetCell), 22, 64);
        const cellSize = width / resolution;
        const half = width * 0.5;
        const cellZ = cellSize * ZStep;

        const nx = resolution + 1;
        const nzCells = (Math.round(resolution / ZStep) + 1) & ~1;
        const nz = nzCells + 1;
        const n = nx * nz;

        const r0 = new SeededRandom(islCfg.seed);
        const perlin = new PerlinNoise2D(islCfg.seed);
        const ox = islCfg.posX, oy = islCfg.posY, oz = islCfg.posZ;
        const bottomDepth = Math.max(8, width * (islCfg.bottomDepthRatio || 0.16));
        const cliffWidth = 0.095;

        // 6近傍千鳥格子の生成
        const baseXz = new Array(n);
        const xz = new Array(n);
        const maxJitter = 0.28;
        for (let iz = 0; iz < nz; iz++) {
            const rowOff = (iz & 1) === 1 ? 0.5 : 0.0;
            const bz = (iz - nzCells * 0.5) * cellZ;
            for (let ix = 0; ix < nx; ix++) {
                const i = iz * nx + ix;
                const bx = (ix + rowOff - resolution * 0.5 - 0.25) * cellSize;
                baseXz[i] = { x: bx, y: bz, z: bz };
                if (ix > 0 && iz > 0 && ix < nx - 1 && iz < nz - 1) {
                    const ang = r0.next() * Math.PI * 2.0;
                    const rad = Math.sqrt(r0.next()) * maxJitter * cellSize;
                    const jx = bx + Math.cos(ang) * rad;
                    const jz = bz + Math.sin(ang) * rad;
                    xz[i] = { x: jx, y: jz, z: jz };
                } else {
                    xz[i] = { x: bx, y: bz, z: bz };
                }
            }
        }

        function Pos(i, y) {
            const pt = xz[i] || { x: 0, z: 0 };
            return { x: pt.x + ox, y: y + oy, z: pt.z + oz };
        }

        function Nb(i, k) {
            const ix = i % nx;
            const iz = (i / nx) | 0;
            const odd = (iz & 1) === 1;
            const x = ix + (odd ? OddDX[k] : EvenDX[k]);
            const z = iz + (odd ? OddDZ[k] : EvenDZ[k]);
            if (x < 0 || z < 0 || x >= nx || z >= nz) return -1;
            return z * nx + x;
        }

        // ---- 1. BuildHeights (輪郭マスクと高さ配列の初期化) ----
        const H = new Float32Array(n);
        const mask = new Float32Array(n);
        const bottomY = new Float32Array(n);
        const inside = new Uint8Array(n);
        const mountain = new Float32Array(n);
        const rawM = new Float32Array(n);
        const outlineNoise = 0.20;

        for (let iz = 0; iz < nz; iz++) {
            for (let ix = 0; ix < nx; ix++) {
                const i = iz * nx + ix;
                const px = xz[i].x / half;
                const pz = xz[i].z / half;
                const r = Math.hypot(px, pz);
                let raw = 1.0 - (r * 1.05 + (perlin.fbm(px, pz, 0, 1.3, 3) - 0.5) * 2.0 * outlineNoise);
                if (ix === 0 || iz === 0 || ix === nx - 1 || iz === nz - 1) raw = -1.0;
                rawM[i] = raw;
                inside[i] = raw > 0.0 ? 1 : 0;
                mask[i] = clamp(raw, 0.0, 1.0);
            }
        }

        // 外周のゼロ交差スナップ（一直線の筒状壁にならないよう、裾野を少し外側へ広げつつ岩の凹凸を持たせる）
        const cragStrength = islCfg.cliffCragginess !== undefined ? islCfg.cliffCragginess : 0.68;
        for (let iz = 0; iz < nz; iz++) {
            for (let ix = 0; ix < nx; ix++) {
                const i = iz * nx + ix;
                if (inside[i]) continue;
                let sx = 0, sz = 0, cnt = 0;
                const px = baseXz[i].x / half, pz = baseXz[i].z / half;
                const rimJag = (perlin.fbm(px * 2.1, pz * 2.1, 14, 1.8, 2) - 0.5) * 0.28 * cragStrength;
                for (let dz = -1; dz <= 1; dz++) {
                    const nzIdx = iz + dz;
                    if (nzIdx < 0 || nzIdx >= nz) continue;
                    for (let dx = -1; dx <= 1; dx++) {
                        if (dx === 0 && dz === 0) continue;
                        const nxIdx = ix + dx;
                        if (nxIdx < 0 || nxIdx >= nx) continue;
                        const nb = nzIdx * nx + nxIdx;
                        if (!inside[nb]) continue;
                        const baseT = clamp(rawM[nb] / (rawM[nb] - rawM[i]), 0.30, 0.72);
                        const t = clamp(baseT + rimJag, 0.24, 0.82);
                        sx += xz[nb].x + (xz[i].x - xz[nb].x) * t;
                        sz += xz[nb].z + (xz[i].z - xz[nb].z) * t;
                        cnt++;
                    }
                }
                if (cnt > 0) {
                    const nxz = sx / cnt, nzz = sz / cnt;
                    xz[i] = { x: nxz, y: nzz, z: nzz };
                }
            }
        }

        const mtRad = (islCfg.mountainAngle || 30) * Math.PI / 180;
        const mtDirX = Math.cos(mtRad), mtDirZ = Math.sin(mtRad);
        const canyonDirX = -mtDirZ, canyonDirZ = mtDirX;
        const edgeSharpness = islCfg.edgeSharpness !== undefined ? islCfg.edgeSharpness : 0.85;

        for (let i = 0; i < n; i++) {
            if (!inside[i]) continue;
            const px = xz[i].x / half;
            const pz = xz[i].z / half;

            // 小島向けに緩やかな2〜3オクターブのドメインワープ
            const wx = px + (perlin.fbm(px, pz, 5, 1.1, 2) - 0.5) * 0.26;
            const wz = pz + (perlin.fbm(px + 7.3, pz - 3.1, 5, 1.1, 2) - 0.5) * 0.26;

            const broadPlains = perlin.fbm(wx, wz, 2, 1.25, 2) - 0.5;
            const rollingHills = perlin.fbm(wx + 3.1, wz - 2.3, 9, 1.6, 2) - 0.5;
            const gentlePlains = (broadPlains * 0.6 + rollingHills * 0.4) * 2.2 * islCfg.plainsAmp;

            // 山塊の配置：裾野(foothills)から山頂(peak)、さらに島の縁の岩壁まで自然に連続させる
            const sideProj = px * mtDirX + pz * mtDirZ;
            const mtNoise = perlin.fbm(wx * 0.85 + 0.2, wz * 0.85 - 0.15, 1, 1.0, 2);
            const mtRaw = mtNoise * 0.58 + (sideProj * 0.5 + 0.22) * 0.56;
            const mtMask = smoothstep(0.32, 0.72, mtRaw);
            mountain[i] = mtMask;

            const detail = perlin.fbm(wx, wz, 2, 1.75, 2);
            const ridge = 1.0 - Math.abs(2.0 * perlin.fbm(wx, wz, 3, 1.35, 2) - 1.0);
            const foothills = smoothstep(0.20, 0.52, mtRaw) * (islCfg.mountainAmp * 0.28);
            const peak = mtMask * (detail * islCfg.mountainAmp * 0.28 + Math.pow(ridge, 1.35) * islCfg.mountainAmp * 0.72);

            let h = islCfg.baseHeight + gentlePlains + foothills + peak;

            // 山塊の中央を割る自然な渓谷
            if (islCfg.canyonDepth > 0.1) {
                const across = px * canyonDirX + pz * canyonDirZ + (perlin.fbm(wx, wz, 4, 1.4, 2) - 0.5) * 0.24;
                const band = Math.abs(across);
                const cm = 1.0 - smoothstep(islCfg.canyonWidth * 0.35, islCfg.canyonWidth, band);
                const basinBoost = 1.0 + 0.35 * Math.exp(-Math.pow((sideProj - 0.22) / 0.25, 2));
                h -= cm * islCfg.canyonDepth * basinBoost * smoothstep(0.08, 0.38, mtMask);
            }

            h = Math.max(h, 2.2);
            const m = mask[i];
            // 崖縁付近に岩の稜線リブ（張り出し・窪み）を加え、垂直な円筒壁になるのを防ぐ
            const cliffRib = (1.0 - Math.abs(2.0 * perlin.fbm(px * 1.8, pz * 1.8, 12, 1.9, 2) - 1.0) - 0.45) * 2.8 * cragStrength * (1.0 - smoothstep(0.0, 0.32, m));
            const plainH = Math.max(2.0, islCfg.baseHeight + gentlePlains);
            const mtExtraH = Math.max(0.0, h - plainH);
            const minPlainRim = 0.32 + 0.32 * edgeSharpness;
            const cliffPlain = minPlainRim + (1.0 - minPlainRim) * Math.pow(clamp(m / (cliffWidth * 1.15), 0, 1), 0.48);
            const cliffMt = 0.20 + 0.80 * Math.pow(clamp(m / (cliffWidth * 1.95), 0, 1), 0.68);
            H[i] = Math.max(1.8, plainH * cliffPlain + mtExtraH * cliffMt + cliffRib);
        }

        // 下部岩盤と外周リムの構築：
        // 1) 水系計算前は外周 (!inside) を y=0 に保ち、水系・道計算後に呼ばれる際には水平な一直線シームを消すため外周リム高さを岩ノイズで上下に揺らす
        // 2) 下部岩盤 (bottomY) は丸いお椀型 (1 - exp) を廃止し、外周からすぐ内向きに絞られる角張った逆円錐＋鋭い岩稜ファセットにする
        const river = new Uint8Array(n);
        const halfW = Math.max(cellSize * 1.12, islCfg.riverWidth * 0.5);

        function rebuildRimAndUndersideProfile(applyRimUndulation = false) {
            for (let i = 0; i < n; i++) {
                const px = xz[i].x / half;
                const pz = xz[i].z / half;
                const rimWave = (perlin.fbm(px * 1.35 + 1.7, pz * 1.35 - 2.3, 11, 1.6, 2) - 0.5) * 2.0;
                const rimJag = (1.0 - Math.abs(2.0 * perlin.fbm(px * 2.3, pz * 2.3, 13, 2.0, 2) - 1.0) - 0.5) * 2.0;
                const localRimY = applyRimUndulation
                    ? (islCfg.baseHeight * 0.15 + (rimWave * 3.2 + rimJag * 2.1) * cragStrength)
                    : 0.0;

                if (!inside[i]) {
                    if (!applyRimUndulation) {
                        H[i] = 0.0;
                        bottomY[i] = 0.0;
                    } else {
                        let minInH = 1e9;
                        let touchesRiver = false;
                        const iz = (i / nx) | 0, ix = i % nx;
                        for (let dz = -1; dz <= 1; dz++) {
                            const nzIdx = iz + dz;
                            if (nzIdx < 0 || nzIdx >= nz) continue;
                            for (let dx = -1; dx <= 1; dx++) {
                                const nxIdx = ix + dx;
                                if (nxIdx < 0 || nxIdx >= nx) continue;
                                const nb = nzIdx * nx + nxIdx;
                                if (!inside[nb]) continue;
                                if (H[nb] < minInH) minInH = H[nb];
                                if (typeof river !== 'undefined' && river[nb]) touchesRiver = true;
                            }
                        }
                        if (minInH < 1e8) {
                            const maxAllowedRim = touchesRiver ? (minInH - 0.95) : (minInH - 1.25);
                            const rv = clamp(localRimY, -5.5, maxAllowedRim);
                            H[i] = rv;
                            bottomY[i] = rv;
                        } else {
                            H[i] = 0.0;
                            bottomY[i] = 0.0;
                        }
                    }
                    continue;
                }

                const m = clamp(mask[i], 0.0, 1.0);
                // 丸いお椀になる指数関数 (1 - exp) を廃止し、外周から直線〜鋭角に絞られる逆円錐・岩柱プロファイルにする
                const linearCone = Math.pow(m, 1.12);
                const ridgeA = 1.0 - Math.abs(2.0 * perlin.fbm(px * 1.1, pz * 1.1, 6, 1.45, 2) - 1.0);
                const ridgeB = 1.0 - Math.abs(2.0 * perlin.fbm(px * 1.8 - 3.1, pz * 1.8 + 1.9, 15, 1.85, 2) - 1.0);
                const cragSpike = Math.pow(ridgeA, 1.45) * 0.75 + Math.pow(ridgeB, 1.6) * 0.45;
                // 岩の段差（ステップ感）を少し混ぜて丸みを消す
                const rawFactor = linearCone * (0.52 + (0.48 + 0.55 * cragStrength) * cragSpike);
                const steps = 4.5;
                const steppedFactor = rawFactor * (1.0 - 0.22 * cragStrength) + (Math.round(rawFactor * steps) / steps) * (0.22 * cragStrength);
                const rimBlend = localRimY * Math.pow(Math.max(0.0, 1.0 - m * 1.35), 1.4);
                bottomY[i] = Math.min(H[i] - 0.8, rimBlend - bottomDepth * steppedFactor);
            }
        }
        rebuildRimAndUndersideProfile(false);

        function SafeBedFloor(i) {
            if (mask[i] < cliffWidth * 0.65) return 0.5;
            return Math.max(bottomY[i] + 2.5, -bottomDepth * 0.35);
        }

        // ---- 2. BuildHydrology (Priority-Flood 渓谷湖抽出 & 単一蛇行河川の掘り込み) ----
        const F = new Float32Array(n);
        const closed = new Uint8Array(n);
        const pq = [];
        function pqPush(val, idx) {
            pq.push({ val, idx });
            let c = pq.length - 1;
            while (c > 0) {
                const p = (c - 1) >> 1;
                if (pq[p].val <= pq[c].val) break;
                const tmp = pq[p]; pq[p] = pq[c]; pq[c] = tmp;
                c = p;
            }
        }
        function pqPop() {
            const top = pq[0];
            const last = pq.pop();
            if (pq.length > 0) {
                pq[0] = last;
                let c = 0;
                while (true) {
                    let l = c * 2 + 1, r = l + 1, sm = c;
                    if (l < pq.length && pq[l].val < pq[sm].val) sm = l;
                    if (r < pq.length && pq[r].val < pq[sm].val) sm = r;
                    if (sm === c) break;
                    const tmp = pq[c]; pq[c] = pq[sm]; pq[sm] = tmp;
                    c = sm;
                }
            }
            return top;
        }

        for (let i = 0; i < n; i++) {
            if (inside[i]) continue;
            closed[i] = 1;
            F[i] = H[i];
            for (let k = 0; k < 6; k++) {
                const nb = Nb(i, k);
                if (nb >= 0 && inside[nb]) {
                    pqPush(F[i], i);
                    break;
                }
            }
        }
        while (pq.length > 0) {
            const cur = pqPop();
            const c = cur.idx;
            for (let k = 0; k < 6; k++) {
                const nb = Nb(c, k);
                if (nb < 0 || closed[nb]) continue;
                closed[nb] = 1;
                F[nb] = Math.max(H[nb], F[c] + 0.0002);
                pqPush(F[nb], nb);
            }
        }

        // 窪地コンポーネントを抽出し、体積上位の maxLakes 個のみを渓谷湖にして残りは埋め戻す
        const dep = new Uint8Array(n);
        for (let i = 0; i < n; i++) {
            dep[i] = (inside[i] && (F[i] - H[i] > 0.04)) ? 1 : 0;
        }
        const visited = new Uint8Array(n);
        const candidates = [];
        for (let i = 0; i < n; i++) {
            if (!dep[i] || visited[i]) continue;
            const comp = [];
            const stack = [i];
            visited[i] = 1;
            let maxDepth = 0, sumVol = 0, minRimH = 1e9;
            while (stack.length > 0) {
                const c = stack.pop();
                comp.push(c);
                const d = F[c] - H[c];
                if (d > maxDepth) maxDepth = d;
                sumVol += d;
                for (let k = 0; k < 6; k++) {
                    const nb = Nb(c, k);
                    if (nb < 0) continue;
                    if (dep[nb]) {
                        if (!visited[nb]) { visited[nb] = 1; stack.push(nb); }
                    } else if (inside[nb]) {
                        if (H[nb] < minRimH) minRimH = H[nb];
                    }
                }
            }
            candidates.push({ comp, maxDepth, sumVol, minRimH });
        }
        candidates.sort((a, b) => b.sumVol - a.sumVol);

        const lakeId = new Int32Array(n);
        const lakeLevels = [0];
        let keptLakes = 0;
        for (let ci = 0; ci < candidates.length; ci++) {
            const cand = candidates[ci];
            if (keptLakes < islCfg.maxLakes && cand.comp.length >= 4 && cand.maxDepth >= 0.45 && cand.minRimH < 1e8) {
                keptLakes++;
                const id = lakeLevels.length;
                const level = cand.minRimH;
                lakeLevels.push(level);
                for (const c of cand.comp) {
                    lakeId[c] = id;
                    const desiredY = level - Math.max(islCfg.riverDepth * 0.85, (level - H[c]) * 1.15);
                    H[c] = clamp(desiredY, SafeBedFloor(c), level - 0.65);
                }
            } else {
                // 小さな水たまり窪地はすべて平坦に埋め戻し、島の水没を防ぐ
                for (const c of cand.comp) {
                    H[c] = F[c];
                }
            }
        }

        // 流路探索用の flowF を構築し、渓谷湖の流出口（または山岳の谷頭）から1本の主要な蛇行河川を流す
        const flowH = new Float32Array(n);
        for (let i = 0; i < n; i++) {
            let bias = 0;
            if (inside[i] && lakeId[i] === 0) {
                const px = baseXz[i].x / half, pz = baseXz[i].z / half;
                const meander = Math.sin((px * mtDirX + pz * mtDirZ) * 4.2) * 0.85;
                const across = (px * canyonDirX + pz * canyonDirZ) - meander * 0.18;
                bias = Math.abs(across) * 1.6 * (1.0 - mountain[i] * 0.4);
            }
            flowH[i] = H[i] + bias;
        }
        const flowF = new Float32Array(n);
        closed.fill(0);
        pq.length = 0;
        for (let i = 0; i < n; i++) {
            if (inside[i]) continue;
            closed[i] = 1;
            flowF[i] = flowH[i];
            for (let k = 0; k < 6; k++) {
                const nb = Nb(i, k);
                if (nb >= 0 && inside[nb]) { pqPush(flowF[i], i); break; }
            }
        }
        while (pq.length > 0) {
            const cur = pqPop();
            const c = cur.idx;
            for (let k = 0; k < 6; k++) {
                const nb = Nb(c, k);
                if (nb < 0 || closed[nb]) continue;
                closed[nb] = 1;
                const eps = 0.0003 + 0.0005 * perlin.fbm(baseXz[nb].x / half, baseXz[nb].z / half, 9, 2.5, 2);
                flowF[nb] = Math.max(flowH[nb], flowF[c] + eps);
                pqPush(flowF[nb], nb);
            }
        }

        const down = new Int32Array(n).fill(-1);
        for (let i = 0; i < n; i++) {
            if (!inside[i]) continue;
            let bestS = 0;
            for (let k = 0; k < 6; k++) {
                const nb = Nb(i, k);
                if (nb < 0 || flowF[nb] >= flowF[i]) continue;
                const dist = Math.hypot(xz[i].x - xz[nb].x, xz[i].z - xz[nb].z);
                const s = (flowF[i] - flowF[nb]) / Math.max(0.1, dist);
                if (s > bestS) { bestS = s; down[i] = nb; }
            }
        }

        const centerRiver = new Uint8Array(n);
        const bankSlopeFlag = new Uint8Array(n);
        const riverW = new Float32Array(n).fill(NaN);
        const riverCenterOrdered = [];

        if (islCfg.riverAmount > 0.05) {
            let startNode = -1;
            let startLakeId = 0;
            // 渓谷湖がある場合は湖の最低リム流出口から開始
            if (lakeLevels.length > 1) {
                startLakeId = 1;
                let bestOut = -1, bestOutF = 1e9;
                for (let i = 0; i < n; i++) {
                    if (lakeId[i] !== 1) continue;
                    for (let k = 0; k < 6; k++) {
                        const nb = Nb(i, k);
                        if (nb >= 0 && inside[nb] && lakeId[nb] === 0 && flowF[nb] < bestOutF) {
                            bestOutF = flowF[nb];
                            bestOut = nb;
                        }
                    }
                }
                startNode = bestOut;
            }
            // 湖がない場合は山あいの谷頭から開始
            if (startNode < 0) {
                let bestScore = -1e9;
                for (let i = 0; i < n; i++) {
                    if (!inside[i] || mask[i] < 0.35 || mountain[i] < 0.25 || mountain[i] > 0.68) continue;
                    const px = xz[i].x / half, pz = xz[i].z / half;
                    const across = Math.abs(px * canyonDirX + pz * canyonDirZ);
                    const score = (1.0 - across * 3.0) * 10.0 + mountain[i] * 5.0;
                    if (score > bestScore) { bestScore = score; startNode = i; }
                }
            }

            if (startNode >= 0) {
                let cur = startNode;
                const visitedTrace = new Uint8Array(n);
                for (let step = 0; step < n; step++) {
                    if (cur < 0 || !inside[cur] || visitedTrace[cur]) break;
                    visitedTrace[cur] = 1;
                    if (lakeId[cur] > 0 && cur !== startNode) break;
                    centerRiver[cur] = 1;
                    riverCenterOrdered.push(cur);
                    cur = down[cur];
                }
            }
        }

        // 河川の掘り込み（天井川を防ぐため waterY <= origH - bankDepth を厳守し、湖の流出口もシームレスに繋ぐ）
        if (riverCenterOrdered.length >= 2) {
            const origH = new Float32Array(H);
            const centerWaterY = new Float32Array(n);
            let prevWaterY = 1e9;
            if (lakeLevels.length > 1) {
                prevWaterY = lakeLevels[1];
            }

            for (let idx = 0; idx < riverCenterOrdered.length; idx++) {
                const r = riverCenterOrdered[idx];
                const bankH = islCfg.riverBankDepth * (idx < 2 && lakeLevels.length > 1 ? 0.15 : 1.0);
                const maxAllowedW = origH[r] - bankH;
                const wY = Math.min(prevWaterY - 0.03, maxAllowedW);
                const floorW = SafeBedFloor(r) + islCfg.riverDepth * 0.65;
                centerWaterY[r] = Math.max(floorW, wY);
                prevWaterY = centerWaterY[r];
            }

            // 中心線からの距離フィールド (連続する中心線セグメントからの線分距離で計測し、斜め流路での川幅のくびれ・分断を防ぐ)
            const distToCenter = new Float32Array(n).fill(1e9);
            const nearestCenter = new Int32Array(n).fill(-1);
            const bankSlopeSpan = Math.max(cellSize * 1.15, 2.6);
            const leveeFlatSpan = Math.max(cellSize * 1.25, 3.0);
            const maxRadius = halfW + bankSlopeSpan + leveeFlatSpan;

            for (let i = 0; i < n; i++) {
                if (!inside[i]) continue;
                const px = xz[i].x, pz = xz[i].z;
                let bestD = 1e9, bestNode = -1;
                for (let s = 0; s < riverCenterOrdered.length; s++) {
                    const rA = riverCenterOrdered[s];
                    const ax = xz[rA].x, az = xz[rA].z;
                    const dNode = Math.hypot(px - ax, pz - az);
                    if (dNode < bestD) {
                        bestD = dNode;
                        bestNode = rA;
                    }
                    if (s + 1 < riverCenterOrdered.length) {
                        const rB = riverCenterOrdered[s + 1];
                        const bx = xz[rB].x, bz = xz[rB].z;
                        const vx = bx - ax, vz = bz - az;
                        const lenSq = vx * vx + vz * vz;
                        if (lenSq > 1e-6) {
                            const t = clamp(((px - ax) * vx + (pz - az) * vz) / lenSq, 0, 1);
                            const dSeg = Math.hypot(px - (ax + vx * t), pz - (az + vz * t));
                            if (dSeg < bestD) {
                                bestD = dSeg;
                                bestNode = (t < 0.5) ? rA : rB;
                            }
                        }
                    }
                }
                if (bestD <= maxRadius && bestNode >= 0) {
                    distToCenter[i] = bestD;
                    nearestCenter[i] = bestNode;
                }
            }

            for (let i = 0; i < n; i++) {
                const src = nearestCenter[i];
                if (src < 0 || !inside[i]) continue;
                const d = distToCenter[i];
                let waterY = centerWaterY[src];
                const wDepth = islCfg.riverDepth;
                const bankH = islCfg.riverBankDepth;

                // 湖と川の接続部にある境界セルも川と同じ深さに掘り下げ、砂の堤防を完全になくす
                if (lakeId[i] > 0) {
                    if (d <= halfW + cellSize * 0.6) {
                        const lLvl = lakeLevels[lakeId[i]];
                        H[i] = Math.min(H[i], Math.max(SafeBedFloor(i), lLvl - wDepth * 0.85));
                    }
                    continue;
                }

                // 隣接する湖がある場合は水面高を滑らかに揃える
                for (let k = 0; k < 6; k++) {
                    const nb = Nb(i, k);
                    if (nb >= 0 && lakeId[nb] > 0) {
                        waterY = Math.max(waterY, lakeLevels[lakeId[nb]] - 0.05);
                    }
                }

                if (d <= halfW) {
                    river[i] = 1;
                    riverW[i] = waterY;
                    const normD = clamp(d / halfW, 0, 1);
                    const bedProfile = 1.0 - 0.25 * normD * normD;
                    H[i] = Math.min(origH[i], Math.max(SafeBedFloor(i), waterY - wDepth * bedProfile));
                } else if (d <= halfW + bankSlopeSpan) {
                    bankSlopeFlag[i] = 1;
                    const t = clamp((d - halfW) / bankSlopeSpan, 0, 1);
                    const leveeTopY = Math.min(origH[i], waterY + bankH);
                    const carvedY = (waterY - wDepth * 0.5) + (leveeTopY - (waterY - wDepth * 0.5)) * smoothstep(0, 1, t);
                    H[i] = Math.max(SafeBedFloor(i), Math.min(origH[i], carvedY));
                } else if (d <= halfW + bankSlopeSpan + leveeFlatSpan) {
                    const t = clamp((d - halfW - bankSlopeSpan) / leveeFlatSpan, 0, 1);
                    const leveeTopY = Math.min(origH[i], waterY + bankH);
                    const flatWeight = (1.0 - smoothstep(0, 1, t)) * (1.0 - mountain[i] * 0.65);
                    H[i] = origH[i] + (leveeTopY - origH[i]) * flatWeight * 0.65;
                }
            }

            // 河道に隣接する1リングの土手頂点にも riverW[b] を設定し、水面を土手斜面の内側へ隙間なく潜り込ませる
            for (let b = 0; b < n; b++) {
                if (!inside[b] || river[b] || lakeId[b] > 0) continue;
                let sumW = 0, cnt = 0;
                for (let k = 0; k < 6; k++) {
                    const nb = Nb(b, k);
                    if (nb >= 0 && river[nb] && !Number.isNaN(riverW[nb])) {
                        sumW += riverW[nb];
                        cnt++;
                    }
                }
                if (cnt > 0) {
                    riverW[b] = sumW / cnt;
                    const minRim = riverW[b] + Math.min(0.85, islCfg.riverBankDepth * 0.42);
                    if (H[b] < minRim) H[b] = minRim;
                }
            }
        }

        // 水辺距離フィールド (shore)
        const shore = new Float32Array(n);
        const distQueue = [];
        const waterDist = new Int16Array(n).fill(-1);
        for (let i = 0; i < n; i++) {
            if (lakeId[i] > 0 || river[i]) {
                waterDist[i] = 0;
                distQueue.push(i);
            }
        }
        let qHead = 0;
        while (qHead < distQueue.length) {
            const c = distQueue[qHead++];
            if (waterDist[c] >= 4) continue;
            for (let k = 0; k < 6; k++) {
                const nb = Nb(c, k);
                if (nb < 0 || !inside[nb] || waterDist[nb] >= 0) continue;
                waterDist[nb] = waterDist[c] + 1;
                distQueue.push(nb);
            }
        }
        for (let i = 0; i < n; i++) {
            if (waterDist[i] >= 0) shore[i] = smoothstep(3.0, 0.0, waterDist[i]);
        }

        // 各頂点そのものの局所傾斜（周囲6近傍との最大高低差 / 距離）と、尾根曲率（周囲平均より高い凸稜線か）を計算
        const cellSteepness = new Float32Array(n);
        const ridgeCurv = new Float32Array(n);
        for (let i = 0; i < n; i++) {
            if (!inside[i]) {
                cellSteepness[i] = 99.0;
                ridgeCurv[i] = 0.0;
                continue;
            }
            let maxLocalSlope = 0;
            let sumNbH = 0, nbCnt = 0;
            for (let k = 0; k < 6; k++) {
                const nb = Nb(i, k);
                if (nb < 0 || !inside[nb]) {
                    maxLocalSlope = Math.max(maxLocalSlope, 2.0);
                    continue;
                }
                const d = Math.hypot(xz[i].x - xz[nb].x, xz[i].z - xz[nb].z) || cellSize;
                const s = Math.abs(H[i] - H[nb]) / d;
                if (s > maxLocalSlope) maxLocalSlope = s;
                sumNbH += H[nb];
                nbCnt++;
            }
            cellSteepness[i] = maxLocalSlope;
            if (nbCnt > 0) {
                const diff = H[i] - (sumNbH / nbCnt);
                ridgeCurv[i] = clamp(diff / Math.max(0.8, cellSize * 0.45), -1.0, 1.0);
            }
        }

        // ---- 3. カスタム編集対応のルート・橋アンカー・等高線追従山道・6近傍直結洞窟トンネルの構築 ----
        function computeDefaultAnchors() {
            let enDir = { x: -0.54, z: 0.46 };
            if (prevCfg) {
                const dx = prevCfg.posX - ox, dz = prevCfg.posZ - oz;
                const len = Math.hypot(dx, dz) || 1;
                enDir = { x: (dx / len) * 0.62, z: (dz / len) * 0.62 };
            }
            let exDir = { x: 0.46, z: -0.54 };
            if (nextCfg) {
                const dx = nextCfg.posX - ox, dz = nextCfg.posZ - oz;
                const len = Math.hypot(dx, dz) || 1;
                exDir = { x: (dx / len) * 0.62, z: (dz / len) * 0.62 };
            }
            return { enDir, exDir };
        }

        const defAnchors = computeDefaultAnchors();
        if (!islCfg.entryNorm) islCfg.entryNorm = { x: defAnchors.enDir.x, z: defAnchors.enDir.z };
        if (!islCfg.exitNorm) islCfg.exitNorm = { x: defAnchors.exDir.x, z: defAnchors.exDir.z };
        if (!Array.isArray(islCfg.waypointsNorm)) {
            islCfg.waypointsNorm = [{
                x: (islCfg.entryNorm.x + islCfg.exitNorm.x) * 0.4 - mtDirX * 0.22,
                z: (islCfg.entryNorm.z + islCfg.exitNorm.z) * 0.4 - mtDirZ * 0.22
            }];
        }
        if (islCfg.hasTrail === undefined) islCfg.hasTrail = true;
        if (islCfg.hasInternalBridge === undefined) islCfg.hasInternalBridge = true;
        if (islCfg.hasBridgeToNext === undefined) islCfg.hasBridgeToNext = true;
        if (islCfg.trailBenchCut === undefined) islCfg.trailBenchCut = 0.78;
        if (islCfg.ridgeFlatten === undefined) islCfg.ridgeFlatten = 0.88;
        if (!islCfg.segmentTypes) islCfg.segmentTypes = {};
        if (islCfg.disabledSegments) {
            Object.keys(islCfg.disabledSegments).forEach(k => {
                if (islCfg.disabledSegments[k] && !islCfg.segmentTypes[k]) {
                    islCfg.segmentTypes[k] = 'none';
                }
            });
            delete islCfg.disabledSegments;
        }
        if (!Array.isArray(islCfg.branches)) islCfg.branches = [];
        if (islCfg.entryNorm.yOffset === undefined) islCfg.entryNorm.yOffset = 0.0;
        if (islCfg.exitNorm.yOffset === undefined) islCfg.exitNorm.yOffset = 0.0;
        islCfg.waypointsNorm.forEach(wp => {
            if (wp.yOffset === undefined) wp.yOffset = 0.0;
        });

        function getSegMode(segKey) {
            const raw = islCfg.segmentTypes[segKey];
            if (raw === 'bridge' || raw === 'tunnel' || raw === 'none' || raw === 'trail') return raw;
            return 'trail';
        }

        // 指定したローカル座標 (tx, tz) と高さオフセット (yOffset) から、3次元ワールド座標と最近傍頂点を返す
        function resolveExactPointOnIsland(normX, normZ, yOffset = 0.0) {
            let tx = (normX || 0) * half;
            let tz = (normZ || 0) * half;
            let bestNode = -1, bestDistSq = 1e12;
            for (let i = 0; i < n; i++) {
                if (!inside[i]) continue;
                const dx = xz[i].x - tx, dz = xz[i].z - tz;
                const d2 = dx * dx + dz * dz;
                if (d2 < bestDistSq) {
                    bestDistSq = d2;
                    bestNode = i;
                }
            }
            if (bestNode < 0) bestNode = Math.floor(n / 2);

            let sumW = 0, sumY = 0;
            for (let i = 0; i < n; i++) {
                if (!inside[i]) continue;
                const dx = xz[i].x - tx, dz = xz[i].z - tz;
                const d = Math.hypot(dx, dz);
                if (d < cellSize * 1.45) {
                    const w = 1.0 / (0.08 + d * d);
                    sumW += w;
                    sumY += H[i] * w;
                }
            }
            const exactLocalX = sumW > 0 ? clamp(tx, -half * 0.95, half * 0.95) : xz[bestNode].x;
            const exactLocalZ = sumW > 0 ? clamp(tz, -half * 0.95, half * 0.95) : xz[bestNode].z;
            const dxN = exactLocalX - xz[bestNode].x;
            const dzN = exactLocalZ - xz[bestNode].z;
            const dN = Math.hypot(dxN, dzN);
            const maxOff = cellSize * 0.55;
            const finalLX = dN > maxOff ? xz[bestNode].x + (dxN / dN) * maxOff : exactLocalX;
            const finalLZ = dN > maxOff ? xz[bestNode].z + (dzN / dN) * maxOff : exactLocalZ;
            const groundLY = sumW > 0 ? (sumY / sumW) : H[bestNode];
            const extraY = Number.isFinite(yOffset) ? yOffset : 0.0;
            const finalLY = groundLY + extraY;

            return {
                nodeIdx: bestNode,
                groundWorldY: groundLY + oy,
                yOffset: extraY,
                worldPos: { x: finalLX + ox, y: finalLY + oy, z: finalLZ + oz }
            };
        }

        // 任意の座標(lx, lz)での地表高・水・谷判定を行うヘルパー
        function sampleTerrainAtLocal(lx, lz) {
            let bestIdx = -1, bestD2 = 1e12;
            for (let i = 0; i < n; i++) {
                const dx = xz[i].x - lx, dz = xz[i].z - lz;
                const d2 = dx * dx + dz * dz;
                if (d2 < bestD2) { bestD2 = d2; bestIdx = i; }
            }
            return bestIdx;
        }

        // 2点間の直線上に地面の出っ張り（めり込み）がなく、本当に橋が必要な川または深い渓谷かを検証する
        function isValidBridgeSpan(aNode, bNode, hasRiverBetween) {
            if (aNode < 0 || aNode >= n || bNode < 0 || bNode >= n || aNode === bNode) return false;
            const ax = xz[aNode].x, az = xz[aNode].z, ay = H[aNode];
            const bx = xz[bNode].x, bz = xz[bNode].z, by = H[bNode];
            const dist = Math.hypot(bx - ax, bz - az);
            if (dist < cellSize * 1.1 || dist > half * 1.25) return false;
            if (!hasRiverBetween && Math.abs(ay - by) > 3.5) return false;

            const steps = Math.max(6, Math.ceil(dist / (cellSize * 0.5)));
            let maxDepthBelow = 0;
            for (let s = 1; s < steps; s++) {
                const t = s / steps;
                const sx = ax + (bx - ax) * t;
                const sz = az + (bz - az) * t;
                const lineY = ay + (by - ay) * t;
                const nearIdx = sampleTerrainAtLocal(sx, sz);
                if (nearIdx < 0 || !inside[nearIdx]) return false;
                if (!hasRiverBetween && H[nearIdx] > lineY - 0.15) return false;
                if (hasRiverBetween && !river[nearIdx] && !bankSlopeFlag[nearIdx] && H[nearIdx] > lineY + 0.6) return false;
                maxDepthBelow = Math.max(maxDepthBelow, Math.min(ay, by) - H[nearIdx]);
            }
            return hasRiverBetween ? (maxDepthBelow >= 0.35) : (maxDepthBelow >= 3.8);
        }

        const caveExcludedCenters = new Set();
        const portalApproachByCenter = new Map();
        const portalBoundaryEdgeKeys = new Set();
        const cavePortalRimVerts = new Uint8Array(n); // 1: 床敷居, 2: 壁・アーチ眉

        // 平原優先・山岳域では尾根筋（稜線）を優先して辿るA*経路探索
        function findGridPath(rawStartIdx, rawGoalIdx, allowWaterCross) {
            const startIdx = portalApproachByCenter.has(rawStartIdx) ? portalApproachByCenter.get(rawStartIdx) : rawStartIdx;
            const goalIdx = portalApproachByCenter.has(rawGoalIdx) ? portalApproachByCenter.get(rawGoalIdx) : rawGoalIdx;
            if (startIdx < 0 || goalIdx < 0 || startIdx === goalIdx) return [Math.max(0, startIdx)];
            const gScore = new Float32Array(n).fill(1e12);
            const fScore = new Float32Array(n).fill(1e12);
            const parent = new Int32Array(n).fill(-1);
            const inClosed = new Uint8Array(n);
            const isMountainTarget = (mountain[startIdx] > 0.18 || mountain[goalIdx] > 0.18 || Math.abs(H[goalIdx] - H[startIdx]) > 5.0);
            const ridgePref = islCfg.ridgeFlatten !== undefined ? islCfg.ridgeFlatten : 0.88;

            pq.length = 0;
            gScore[startIdx] = 0;
            const h0 = Math.hypot(xz[goalIdx].x - xz[startIdx].x, xz[goalIdx].z - xz[startIdx].z);
            fScore[startIdx] = h0;
            pqPush(h0, startIdx);

            while (pq.length > 0) {
                const cur = pqPop();
                const u = cur.idx;
                if (u === goalIdx) break;
                if (inClosed[u]) continue;
                inClosed[u] = 1;

                const prev = parent[u];
                let prevDx = 0, prevDz = 0;
                if (prev >= 0) {
                    const pdx = xz[u].x - xz[prev].x, pdz = xz[u].z - xz[prev].z;
                    const plen = Math.hypot(pdx, pdz) || 1;
                    prevDx = pdx / plen; prevDz = pdz / plen;
                }

                for (let k = 0; k < 6; k++) {
                    const nb = Nb(u, k);
                    if (nb < 0 || !inside[nb] || inClosed[nb] || mask[nb] < cliffWidth * 1.15) continue;
                    if (lakeId[nb] > 0 || (caveExcludedCenters.has(nb) && nb !== goalIdx)) continue;
                    if (!allowWaterCross && river[nb]) continue;

                    const stepDist = Math.hypot(xz[nb].x - xz[u].x, xz[nb].z - xz[u].z) || cellSize;
                    const dy = Math.abs(H[nb] - H[u]);
                    const grade = dy / stepDist;

                    const onRidge = ridgeCurv[nb] > 0.04 ? clamp(ridgeCurv[nb] * 1.8, 0.0, 0.85) * ridgePref : 0.0;
                    const steepRelief = 1.0 - onRidge * 0.72;

                    let cost = stepDist * (1.0 + grade * grade * (isMountainTarget ? 9.5 : 14.0) * steepRelief);
                    cost += cellSteepness[nb] * cellSteepness[nb] * stepDist * 6.0 * steepRelief;
                    if (!isMountainTarget) {
                        cost += mountain[nb] * stepDist * 3.0;
                    } else {
                        if (ridgeCurv[nb] < -0.05) cost += (-ridgeCurv[nb]) * stepDist * 5.5;
                        else if (onRidge > 0) cost *= (1.0 - onRidge * 0.35);
                    }
                    if (mask[nb] < 0.25) cost += (0.25 - mask[nb]) * stepDist * 12.0;
                    if (river[nb]) cost += stepDist * 3.8;
                    if (bankSlopeFlag[nb]) cost += stepDist * 1.8;

                    if (prev >= 0) {
                        const ndx = (xz[nb].x - xz[u].x) / stepDist;
                        const ndz = (xz[nb].z - xz[u].z) / stepDist;
                        const dot = prevDx * ndx + prevDz * ndz;
                        if (dot < 0.7) cost += (0.7 - dot) * stepDist * 1.6;
                    }

                    const tentativeG = gScore[u] + cost;
                    if (tentativeG < gScore[nb]) {
                        parent[nb] = u;
                        gScore[nb] = tentativeG;
                        const h = Math.hypot(xz[goalIdx].x - xz[nb].x, xz[goalIdx].z - xz[nb].z);
                        fScore[nb] = tentativeG + h;
                        pqPush(fScore[nb], nb);
                    }
                }
            }

            const path = [];
            let cur = goalIdx;
            if (parent[cur] < 0 && cur !== startIdx) {
                return [startIdx, goalIdx];
            }
            while (cur >= 0) {
                path.push(cur);
                if (cur === startIdx) break;
                cur = parent[cur];
            }
            path.reverse();
            return path;
        }

        const entryResolved = resolveExactPointOnIsland(islCfg.entryNorm.x, islCfg.entryNorm.z, islCfg.entryNorm.yOffset);
        const exitResolved = resolveExactPointOnIsland(islCfg.exitNorm.x, islCfg.exitNorm.z, islCfg.exitNorm.yOffset);

        // 初回ビルド時：川を跨ぐ島（経由点が未設定かつ自動渡河橋がON）では、川の左右両岸を自動的に
        // 入口と出口の「真ん中の経由点（橋の始点・終点）」として順序通りに組み込む
        if (islCfg.hasInternalBridge !== false && !islCfg._autoBridgeInitialized && islCfg.waypointsNorm.length === 0 && riverCenterOrdered.length >= 2) {
            islCfg._autoBridgeInitialized = true;
            const probePath = findGridPath(entryResolved.nodeIdx, exitResolved.nodeIdx, true);
            if (probePath.length >= 4) {
                let idx = 0;
                while (idx < probePath.length - 1) {
                    const u = probePath[idx];
                    if (river[u] || bankSlopeFlag[u]) {
                        let bankStart = Math.max(0, idx - 1);
                        while (bankStart > 0 && (river[probePath[bankStart]] || bankSlopeFlag[probePath[bankStart]])) {
                            bankStart--;
                        }
                        let bankEnd = idx + 1;
                        while (bankEnd < probePath.length - 1 && (river[probePath[bankEnd]] || bankSlopeFlag[probePath[bankEnd]])) {
                            bankEnd++;
                        }
                        let crossesActualRiver = false;
                        for (let m = bankStart; m <= bankEnd; m++) {
                            if (river[probePath[m]]) { crossesActualRiver = true; break; }
                        }
                        const aNode = probePath[bankStart];
                        const bNode = probePath[bankEnd];
                        const spanDist = Math.hypot(xz[aNode].x - xz[bNode].x, xz[aNode].z - xz[bNode].z);
                        const maxAllowedInternalSpan = islCfg.riverWidth * 2.3 + cellSize * 2.2;
                        if (crossesActualRiver && aNode !== entryResolved.nodeIdx && bNode !== exitResolved.nodeIdx
                            && spanDist <= maxAllowedInternalSpan && Math.abs(H[aNode] - H[bNode]) <= 2.4
                            && isValidBridgeSpan(aNode, bNode, true)) {
                            islCfg.waypointsNorm = [
                                { x: Number((xz[aNode].x / half).toFixed(3)), z: Number((xz[aNode].z / half).toFixed(3)), yOffset: 0.0 },
                                { x: Number((xz[bNode].x / half).toFixed(3)), z: Number((xz[bNode].z / half).toFixed(3)), yOffset: 0.0 }
                            ];
                            islCfg.segmentTypes['seg_0'] = 'trail';
                            islCfg.segmentTypes['seg_1'] = 'bridge';
                            islCfg.segmentTypes['seg_2'] = 'trail';
                            break;
                        }
                        idx = bankEnd + 1;
                    } else {
                        idx++;
                    }
                }
            }
        } else {
            islCfg._autoBridgeInitialized = true;
        }

        const waypointResolved = islCfg.waypointsNorm.map(wp => resolveExactPointOnIsland(wp.x, wp.z, wp.yOffset || 0));
        const entryNode = entryResolved.nodeIdx;
        const exitNode = exitResolved.nodeIdx;
        const waypointNodes = waypointResolved.map(r => r.nodeIdx);
        const caveW = clamp(islCfg.caveWidth !== undefined ? islCfg.caveWidth : 3.2, 2.0, 5.5);
        const caveH = clamp(islCfg.caveHeight !== undefined ? islCfg.caveHeight : 2.8, 2.0, 5.0);

        // トンネルポータル用ヘルパー（6近傍リングが全て島内にある頂点へスナップし開口部を成形）
        function isValidCaveCenter(c) {
            if (c < 0 || !inside[c] || mask[c] < 0.12 || lakeId[c] > 0) return false;
            for (let k = 0; k < 6; k++) {
                const nb = Nb(c, k);
                if (nb < 0 || !inside[nb]) return false;
            }
            return true;
        }

        function findNearestValidCaveNodeFromNode(startNodeIdx, avoidSet = null) {
            if (isValidCaveCenter(startNodeIdx) && (!avoidSet || !avoidSet.has(startNodeIdx))) return startNodeIdx;
            const tx = xz[startNodeIdx].x, tz = xz[startNodeIdx].z;
            let bestNode = -1, bestD2 = 1e12;
            for (let i = 0; i < n; i++) {
                if (!isValidCaveCenter(i)) continue;
                if (avoidSet && avoidSet.has(i)) continue;
                const dx = xz[i].x - tx, dz = xz[i].z - tz;
                const d2 = dx * dx + dz * dz;
                if (d2 < bestD2) { bestD2 = d2; bestNode = i; }
            }
            return bestNode;
        }

        // トンネル進入方向 (inDir) を基準に、必ず「0:床左 → 1:床右 → 2:右壁 → 3:右天井 → 4:左天井 → 5:左壁」の順でリングを揃え、
        // 山肌のごつごつ感(cragStrength)に合わせた自然な非対称の岩の坑口へ成形する
        function shapePortalRing(centerIdx, oppositeIdx, targetLocalFloorY, userYOffset = 0.0) {
            const ring = [];
            for (let k = 0; k < 6; k++) ring.push(Nb(centerIdx, k));

            const cx = xz[centerIdx].x, cz = xz[centerIdx].z;
            const tx = xz[oppositeIdx].x, tz = xz[oppositeIdx].z;
            let inX = tx - cx, inZ = tz - cz;
            const inLen = Math.hypot(inX, inZ) || 1;
            inX /= inLen; inZ /= inLen;
            const outX = -inX, outZ = -inZ;
            const rightX = -inZ, rightZ = inX;

            // 外側 (outDir) に最も正面を向く辺を入口敷居 (Floor-Left 〜 Floor-Right) として選ぶ
            let bestK = 0, bestScore = -1e9;
            for (let k = 0; k < 6; k++) {
                const n0 = ring[k], n1 = ring[(k + 1) % 6];
                const mx = (xz[n0].x + xz[n1].x) * 0.5 - cx;
                const mz = (xz[n0].z + xz[n1].z) * 0.5 - cz;
                const mLen = Math.hypot(mx, mz) || 1;
                const align = (mx * outX + mz * outZ) / mLen;
                const score = align * 10.0 - (H[n0] + H[n1]) * 0.06;
                if (score > bestScore) { bestScore = score; bestK = k; }
            }

            // 敷居辺が必ず「左(0) → 右(1)」向きになるようリング巡回方向を正規化（ねじれ完全防止）
            const nA = ring[bestK], nB = ring[(bestK + 1) % 6];
            const edgeDotRight = (xz[nB].x - xz[nA].x) * rightX + (xz[nB].z - xz[nA].z) * rightZ;
            const archRing = [];
            if (edgeDotRight >= 0) {
                for (let k = 0; k < 6; k++) archRing.push(ring[(bestK + k) % 6]);
            } else {
                for (let k = 0; k < 6; k++) archRing.push(ring[(bestK + 1 - k + 6) % 6]);
            }

            // 急斜面で手前の敷居2頂点を持ち上げてベランダ状にせり出させないよう、元の敷居の標高を基準に床高を決定する
            const origH0 = H[archRing[0]];
            const origH1 = H[archRing[1]];
            const origLowThresh = Math.min(origH0, origH1);
            const origAvgThresh = (origH0 + origH1) * 0.5;
            const minSafeFloor = Math.max(1.6, bottomY[centerIdx] + 1.8);
            const naturalFloorY = Math.min(targetLocalFloorY - userYOffset, origAvgThresh + 0.12);
            const desiredFloorY = naturalFloorY + userYOffset;
            const maxNoJutFloor = Math.max(origLowThresh + 0.55, origAvgThresh + 0.20) + Math.max(0.0, userYOffset);
            const floorY = clamp(desiredFloorY, minSafeFloor, Math.min(Math.max(H[centerIdx] + 16.0, minSafeFloor + 2.0), maxNoJutFloor));

            // 坑口の6頂点が水平に寝すぎたり横壁がパックリ開きすぎないよう、地形メッシュ生成前に安全な範囲で XZ を正面アーチ形状へ微調整する
            const desiredHalfW = clamp(caveW * 0.54, cellSize * 0.62, cellSize * 1.18);
            const maxShift = cellSize * 0.30;
            const shiftVertSafely = (vIdx, dxS, dzS) => {
                if (cavePortalRimVerts[vIdx] > 0 || !inside[vIdx] || river[vIdx] || lakeId[vIdx] > 0) return;
                const sLen = Math.hypot(dxS, dzS);
                if (sLen < 1e-4) return;
                const scale = sLen > maxShift ? (maxShift / sLen) : 1.0;
                const nxz = xz[vIdx].x + dxS * scale;
                const nzz = xz[vIdx].z + dzS * scale;
                xz[vIdx] = { x: nxz, y: nzz, z: nzz };
            };
            // 天井眉 (3, 4) をわずかに手前へ起こして自然な洞窟の口にし、左右壁 (2, 5) の過度な横開きを抑える
            shiftVertSafely(archRing[3], outX * cellSize * 0.24, outZ * cellSize * 0.24);
            shiftVertSafely(archRing[4], outX * cellSize * 0.24, outZ * cellSize * 0.24);
            for (const [wIdx, sideSign] of [[archRing[2], 1], [archRing[5], -1]]) {
                const relX = xz[wIdx].x - cx, relZ = xz[wIdx].z - cz;
                const curLat = relX * rightX + relZ * rightZ;
                const targetLat = sideSign * desiredHalfW;
                const latDelta = clamp(targetLat - curLat, -cellSize * 0.28, cellSize * 0.28);
                shiftVertSafely(wIdx, rightX * latDelta, rightZ * latDelta);
            }

            // 山肌のノイズとゴツゴツ感を使って、左右非対称の自然な岩の坑口高さを決定（壁より天井が低くなる逆転・極端な縦スリットを防止）
            const cragBias = (idx, salt) => (perlin.fbm(xz[idx].x / half * 3.1, xz[idx].z / half * 3.1, salt, 2.2, 2) - 0.5) * 2.0 * cragStrength;
            const sillTilt = clamp((origH1 - origH0) * 0.25, -0.18, 0.18) * (0.4 + 0.6 * cragStrength);
            H[archRing[0]] = floorY - sillTilt;
            H[archRing[1]] = floorY + sillTilt;
            H[archRing[2]] = clamp(H[archRing[2]], floorY + caveH * (0.46 + cragBias(archRing[2], 3) * 0.12), floorY + caveH * (0.82 + cragBias(archRing[2], 4) * 0.12));
            H[archRing[5]] = clamp(H[archRing[5]], floorY + caveH * (0.46 + cragBias(archRing[5], 5) * 0.12), floorY + caveH * (0.82 + cragBias(archRing[5], 6) * 0.12));
            const minCeilR = Math.max(H[archRing[2]] + 0.38, floorY + caveH * (0.94 + cragBias(archRing[3], 7) * 0.14));
            const minCeilL = Math.max(H[archRing[5]] + 0.38, floorY + caveH * (0.94 + cragBias(archRing[4], 9) * 0.14));
            H[archRing[3]] = clamp(H[archRing[3]], minCeilR, Math.max(minCeilR + 0.25, floorY + caveH * (1.28 + cragBias(archRing[3], 8) * 0.16)));
            H[archRing[4]] = clamp(H[archRing[4]], minCeilL, Math.max(minCeilL + 0.25, floorY + caveH * (1.28 + cragBias(archRing[4], 10) * 0.16)));
            H[centerIdx] = floorY;

            // 坑口背後の土かぶりは確実に山体奥側 (dotIn > 0.38) かつ高低差が小さい頂点のみに限定し、周囲のせり出しを防止
            for (const browIdx of [archRing[3], archRing[4]]) {
                for (let k = 0; k < 6; k++) {
                    const bnb = Nb(browIdx, k);
                    if (bnb < 0 || !inside[bnb] || bnb === centerIdx || archRing.includes(bnb)) continue;
                    if (river[bnb] || lakeId[bnb] > 0) continue;
                    const dotIn = (xz[bnb].x - cx) * inX + (xz[bnb].z - cz) * inZ;
                    const browCoverY = floorY + caveH * (0.85 + 0.22 * Math.max(0, cragBias(bnb, 11)));
                    if (dotIn > 0.38 && H[bnb] < browCoverY && (browCoverY - H[bnb]) < 2.8) {
                        H[bnb] = browCoverY;
                    }
                }
            }

            // 境界エッジを未分割テーブルに登録（地形の崖多段分割による隙間・背景透けを100%防止）
            for (let k = 0; k < 6; k++) {
                const u = archRing[k], v = archRing[(k + 1) % 6];
                const ek = u < v ? `${u}_${v}` : `${v}_${u}`;
                portalBoundaryEdgeKeys.add(ek);
                cavePortalRimVerts[u] = (k === 0 || k === 1) ? 1 : 2;
            }

            // 坑口手前のアプローチ頂点を登録（A*経路探索が坑口の正面から接続するようにする）
            const sillMidX = (xz[archRing[0]].x + xz[archRing[1]].x) * 0.5;
            const sillMidZ = (xz[archRing[0]].z + xz[archRing[1]].z) * 0.5;
            let approachNode = archRing[0];
            let bestAppScore = -1e9;
            for (const sIdx of [archRing[0], archRing[1]]) {
                for (let k = 0; k < 6; k++) {
                    const nb = Nb(sIdx, k);
                    if (nb < 0 || !inside[nb] || nb === centerIdx || archRing.includes(nb)) continue;
                    if (river[nb] || lakeId[nb] > 0) continue;
                    const dxA = xz[nb].x - sillMidX, dzA = xz[nb].z - sillMidZ;
                    const dLen = Math.hypot(dxA, dzA) || 1;
                    const align = (dxA * outX + dzA * outZ) / dLen;
